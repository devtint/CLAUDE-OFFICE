<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Office</title>
<style>
  :root { --bg: #1f1e1d; --text: #f0eee6; --faint: #6f6a62; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) { --bg: #faf9f5; --text: #1f1e1d; --faint: #a39e93; }
  }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.4 system-ui, "Segoe UI", sans-serif; }
  body { padding: 8px; }
  canvas { display: block; width: 100%; cursor: default; border-radius: 8px; }
  #tip { position: fixed; pointer-events: none; display: none; background: #2b2926; color: #f0eee6;
    border: 1px solid #3d3a36; border-radius: 6px; padding: 4px 8px; font-size: 12px; max-width: 260px; }
</style>
</head>
<body>
<canvas id="office"></canvas>
<div id="tip"></div>
<script>
// One shared open-plan office for every active Claude Code session.
//   Back wall: shared facilities (bookshelf, search cabinet, tool rack, whiteboard, calendar,
//   mailbox, browser screen, web globe, design easel) and the door.
//   Middle: one desk pod per session (code desk and terminal, plus spare desks when it is busy;
//   helpers sit at the spare desks).
//   Front: the lounge (huddle table, coffee, couches, plants) for breaks and helper meetings.
// Claudes walk through the aisles to the station for the tool they are running.
const canvas = document.getElementById('office'), ctx = canvas.getContext('2d');
const tip = document.getElementById('tip');
const BODY = ['..##########..', '..##E####E##..', '..##E####E##..', '##############',
  '##############', '..##########..', '..##########..'];
const LEGS = [['..#.#....#.#..', '..#.#....#.#..'], ['...#.#..#.#...', '...#.#..#.#...']];
const PATS = ['Hi! I am Claude.', 'Back to work!', 'Hehe, that tickles!', 'Thanks for the pat!',
  'Time for a stretch?', 'Drink some water.'];
const LABELS = { desk: 'Code desk', desk2: 'Spare desk', desk3: 'Spare desk', desk4: 'Spare desk', terminal: 'Terminal',
  browser: 'Browser screen', shelf: 'Bookshelf (reading files)', search: 'Search cabinet', globe: 'Web globe',
  calendar: 'Calendar', mail: 'Mailbox', easel: 'Design easel', rack: 'Tool rack (MCP, skills)',
  huddle: 'Huddle table (helpers)', board: 'Whiteboard (thinking, planning)', coffee: 'Coffee',
  couch: 'Couch', couch2: 'Couch', plant: 'Plant', plant2: 'Plant' };
const WIDTH = { desk: 44, desk2: 44, desk3: 44, desk4: 44, terminal: 40, browser: 48, shelf: 34,
  search: 28, globe: 28, calendar: 26, mail: 24, easel: 30, rack: 24, huddle: 38, board: 48,
  coffee: 28, couch: 42, couch2: 42, plant: 22, plant2: 22 };

// layout, in logical pixels (the canvas is scaled to the panel)
const WALL = 64, BACK = 94, LANE0 = 124, ROW = 62, M = 10;
const PW = 180, PGAP = 14, POD_B1 = 74, POD_L1 = 100, POD_B2 = 134, POD_L2 = 160, POD_H1 = 110, POD_H2 = 170;
const LOUNGE_H = 104;
const FAC = ['shelf', 'search', 'rack', 'board', 'calendar', 'mail', 'browser', 'globe', 'easel'];
const FAC_FLOOR = ['easel', 'globe', 'mail', 'rack', 'search'];  // these can stand in a second row
const MIN_W = 420, MAX_S = 1.6;
const SLOTS = [0, -16, 16, -32, 32, -48, 48];

let pods = new Map(), order = [], critters = new Map(), spots = {}, items = [], aisles = [], lanes = [];
let t = 0, hearts = [], W = 420, S = 1, H = 300, last = null, lounge = null;

function stationFor(name) {
  if (!name) return null;
  if (/^(Bash|PowerShell|Monitor)$/.test(name)) return 'terminal';
  if (/^(Edit|Write|NotebookEdit)$/.test(name)) return 'desk';
  if (name === 'Read') return 'shelf';
  if (/^(Grep|Glob)$/.test(name)) return 'search';
  if (/^Web(Search|Fetch)$/.test(name)) return 'globe';
  if (/Browser|chrome|computer-use/.test(name)) return 'browser';
  if (/^(Agent|Task|SendMessage)$/.test(name) || /start_session|send_message/.test(name)) return 'huddle';
  if (/^(Artifact|ArtifactData|ArtifactComments)$/.test(name) || /show_widget|visualize|design/i.test(name)) return 'easel';
  if (/update_plan|wrap_up|mark_chapter|EnterPlanMode|ExitPlanMode|AskUserQuestion/.test(name)) return 'board';
  if (/event|calendar|suggest_time/i.test(name)) return 'calendar';
  if (/mail|draft|thread|label|forward|reply/i.test(name)) return 'mail';
  if (/spreadsheet|_doc|file|presentation|values/i.test(name)) return 'shelf';
  return 'rack';
}

// ---------- drawing helpers ----------
function R(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); }
function txt(s, x, y, c, size = 11, align = 'left', weight = '') {
  ctx.fillStyle = c; ctx.font = `${weight} ${size}px system-ui, Segoe UI, sans-serif`;
  ctx.textAlign = align; ctx.fillText(s, x, y);
}
function fit(s, w) {
  if (ctx.measureText(s).width <= w) return s;
  while (s.length > 1 && ctx.measureText(s + '...').width > w) s = s.slice(0, -1);
  return s + '...';
}
function table(x, b, w) {
  R(x, b - 18, w, 4, '#9b6b45'); R(x, b - 14, w, 1, '#6e4a30');
  R(x + 2, b - 14, 3, 14, '#6e4a30'); R(x + w - 5, b - 14, 3, 14, '#6e4a30');
}
function monitor(x, y, w, h, screen) {
  R(x, y, w, h, '#15171a'); R(x + 2, y + 2, w - 4, h - 4, screen);
  R(x + w / 2 - 2, y + h, 4, 4, '#15171a'); R(x + w / 2 - 6, y + h + 4, 12, 2, '#15171a');
}
const CODE = ['#c678dd', '#61afef', '#98c379', '#e5c07b', '#e06c75'];

const DRAW = {
  desk(x, b, on, ry, n) {
    table(x, b, 44); monitor(x + 10, b - 40, 24, 16, on ? '#1e2a38' : '#23272c');
    if (on) for (let i = 0; i < 4; i++) {
      const w = 4 + ((i * 7 + (t >> 4) + n) % 11);
      R(x + 13 + (i % 2) * 3, b - 37 + i * 3, Math.min(w, 17 - (i % 2) * 3), 1, CODE[(i + n) % 5]);
    }
    R(x + 14, b - 20, 16, 2, '#4b4f56'); R(x + 37, b - 24, 4, 6, '#e8e4dc'); R(x + 41, b - 22, 1, 2, '#e8e4dc');
  },
  terminal(x, b, on) {
    table(x, b, 40); monitor(x + 8, b - 40, 24, 16, '#0b0f0b');
    const g = on ? '#3fb950' : '#1f4d29';
    for (let i = 0; i < 3; i++) R(x + 11, b - 37 + i * 3, 4 + ((i * 5 + (on ? t >> 3 : 0)) % 12), 1, g);
    if (on && (t >> 4) % 2) R(x + 11, b - 28, 3, 2, g);
    R(x + 12, b - 20, 16, 2, '#4b4f56');
  },
  browser(x, b, on) {
    table(x, b, 48); monitor(x + 6, b - 44, 36, 20, on ? '#eef1f5' : '#34383e');
    R(x + 8, b - 42, 32, 3, on ? '#c9ced6' : '#2a2d32');
    if (on) {
      R(x + 9, b - 41, 1, 1, '#e5484d'); R(x + 11, b - 41, 1, 1, '#e0a43a'); R(x + 13, b - 41, 1, 1, '#3fb950');
      R(x + 10, b - 37, 12, 2, '#6A9BCC'); R(x + 10, b - 34, 26, 1, '#9aa3ad'); R(x + 10, b - 32, 20, 1, '#9aa3ad');
      R(x + 10 + ((t >> 3) % 20), b - 30, 2, 2, '#1f1e1d');
    }
    R(x + 16, b - 20, 16, 2, '#4b4f56');
  },
  shelf(x, b, on) {
    R(x, b - 54, 34, 54, '#7a5235'); R(x + 2, b - 52, 30, 50, '#4e3423');
    const cols = ['#c0504d', '#4f81bd', '#9bbb59', '#e0a43a', '#8064a2', '#d97757'];
    [b - 38, b - 21, b - 4].forEach((rb, s) => {
      for (let i = 0; i < 7; i++) {
        if (on && s === 1 && i === ((t >> 5) % 7)) continue;  // a book taken out to read
        const h = 9 + ((i * 3 + s * 5) % 5);
        R(x + 3 + i * 4, rb - h, 3, h, cols[(i + s * 2) % cols.length]);
      }
      R(x + 2, rb, 30, 2, '#7a5235');
    });
  },
  search(x, b, on) {
    R(x, b - 36, 28, 36, '#6b7280');
    for (let i = 0; i < 3; i++) {
      const out = on && i === ((t >> 5) % 3) ? 3 : 0;
      R(x + 2 - out, b - 34 + i * 12, 24 + out, 10, '#7d8591'); R(x + 11 - out, b - 30 + i * 12, 6, 2, '#c0c4cc');
    }
    const wob = on ? Math.sin(t / 6) * 3 : 0;
    ctx.strokeStyle = '#e8e4dc'; ctx.lineWidth = 2; ctx.beginPath();
    ctx.arc(x + 14 + wob, b - 46, 5, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + 18 + wob, b - 42); ctx.lineTo(x + 22 + wob, b - 38); ctx.stroke();
  },
  globe(x, b, on) {
    R(x + 13, b - 12, 3, 12, '#7a5235'); R(x + 6, b - 3, 16, 3, '#7a5235');
    ctx.save(); ctx.beginPath(); ctx.arc(x + 14, b - 23, 10, 0, Math.PI * 2); ctx.fillStyle = '#3b82c4'; ctx.fill();
    ctx.clip();
    const off = (t * (on ? 0.4 : 0.04)) % 30;
    for (let k = -1; k < 2; k++) {
      const gx = x + 4 + k * 30 + off;
      R(gx, b - 30, 8, 5, '#5fa35f'); R(gx + 12, b - 24, 6, 8, '#5fa35f'); R(gx + 4, b - 20, 5, 4, '#5fa35f');
    }
    ctx.restore();
    ctx.strokeStyle = '#c9a26b'; ctx.lineWidth = 1; ctx.beginPath();
    ctx.arc(x + 14, b - 23, 12, Math.PI * 0.75, Math.PI * 2.25); ctx.stroke();
  },
  calendar(x, b, on, ry) {
    const y = ry + 28;
    R(x + 2, y, 22, 26, '#f5f3ee'); R(x + 2, y, 22, 6, '#d64545');
    R(x + 7, y - 2, 2, 4, '#555'); R(x + 17, y - 2, 2, 4, '#555');
    for (let r = 0; r < 4; r++) for (let c = 0; c < 5; c++) {
      const hit = on && r * 5 + c === ((t >> 4) % 20);
      R(x + 4 + c * 4, y + 8 + r * 4, 3, 3, hit ? '#d97757' : '#cfcac0');
    }
  },
  mail(x, b, on) {
    R(x + 10, b - 20, 3, 20, '#555'); R(x + 2, b - 32, 20, 12, '#3b6fb6'); R(x + 2, b - 32, 20, 3, '#2f5c99');
    R(x + 20, on ? b - 40 : b - 32, 2, 8, on ? '#e5484d' : '#8a8a8a');
    if (on) { const k = (t >> 2) % 20; R(x + 6 - k * 0.3, b - 36 - k * 0.6, 8, 5, '#f5f3ee'); }
  },
  easel(x, b, on) {
    ctx.strokeStyle = '#8a5a3c'; ctx.lineWidth = 2; ctx.beginPath();
    ctx.moveTo(x + 15, b - 50); ctx.lineTo(x + 5, b); ctx.moveTo(x + 15, b - 50); ctx.lineTo(x + 25, b);
    ctx.stroke();
    R(x + 3, b - 46, 24, 22, '#f5f3ee');
    const k = on ? (t >> 3) % 4 : 3;
    R(x + 6, b - 42, 8, 6, '#D97757'); if (k > 0) R(x + 15, b - 40, 9, 4, '#6A9BCC');
    if (k > 1) R(x + 6, b - 33, 18, 2, '#9aa3ad'); if (k > 2) R(x + 6, b - 30, 12, 2, '#9aa3ad');
    R(x + 2, b - 24, 26, 2, '#8a5a3c');
  },
  rack(x, b, on) {
    R(x, b - 58, 24, 58, '#1b1d22'); R(x + 1, b - 57, 22, 56, '#24272e');
    for (let i = 0; i < 7; i++) {
      R(x + 3, b - 54 + i * 8, 18, 6, '#2e323a');
      const lit = on ? ((i * 7 + (t >> 2)) % 5) > 1 : i % 3 === 0;
      R(x + 5, b - 52 + i * 8, 2, 2, lit ? '#3fb950' : '#1f3a26');
      R(x + 9, b - 52 + i * 8, 2, 2, lit && i % 2 ? '#e0a43a' : '#3a3220');
    }
  },
  huddle(x, b, on) {
    R(x + 1, b - 9, 6, 2, '#6a4ca8'); R(x + 2, b - 7, 2, 7, '#444'); R(x + 31, b - 9, 6, 2, '#6a4ca8'); R(x + 34, b - 7, 2, 7, '#444');
    ctx.fillStyle = '#9b6b45'; ctx.beginPath(); ctx.ellipse(x + 19, b - 16, 14, 4, 0, 0, Math.PI * 2); ctx.fill();
    R(x + 17, b - 14, 4, 14, '#6e4a30'); R(x + 12, b - 1, 14, 1, '#6e4a30');
    if (on) R(x + 14 + ((t >> 4) % 3) * 3, b - 19, 6, 2, '#f5f3ee');
  },
  board(x, b, on, ry) {
    const y = ry + 24;
    R(x, y, 48, 34, '#9aa0a8'); R(x + 2, y + 2, 44, 30, '#f7f6f2');
    const cols = ['#4f81bd', '#c0504d', '#3f9b5a'], n = on ? (t >> 3) % 40 : 40;
    for (let i = 0; i < 4; i++) R(x + 6, y + 6 + i * 6, Math.max(0, Math.min(30 - i * 5, n - i * 8)), 2, cols[i % 3]);
    if (n > 30) { ctx.strokeStyle = '#c0504d'; ctx.lineWidth = 1; ctx.strokeRect(x + 34, y + 18, 8, 8); }
    R(x + 8, y + 34, 32, 2, '#7d838b');
  },
  coffee(x, b, on) {
    R(x, b - 22, 28, 22, '#5c5f66'); R(x, b - 24, 28, 3, '#8a8d94');
    R(x + 7, b - 40, 14, 16, '#2b2b2b'); R(x + 9, b - 38, 10, 4, '#444'); R(x + 12, b - 29, 5, 4, '#e8e4dc');
    if (on) for (let i = 0; i < 2; i++) {
      const k = (t + i * 20) % 40; R(x + 13 + i * 2 + Math.sin(k / 5) * 2, b - 30 - k / 2, 1, 2, `rgba(255,255,255,${0.5 - k / 80})`);
    }
  },
  couch(x, b, on) {
    R(x, b - 24, 42, 9, '#6a4ca8'); R(x, b - 16, 42, 10, '#7c5cbf');
    R(x - 1, b - 20, 5, 14, '#5b3f94'); R(x + 38, b - 20, 5, 14, '#5b3f94');
    R(x + 3, b - 6, 3, 6, '#3a2a5e'); R(x + 36, b - 6, 3, 6, '#3a2a5e');
  },
  plant(x, b) {
    R(x + 5, b - 12, 12, 12, '#b5651d'); R(x + 4, b - 13, 14, 2, '#c97a35');
    [[10, 24, 3, 12], [5, 20, 5, 4], [13, 22, 6, 4], [7, 28, 4, 5], [12, 30, 4, 6]].forEach(
      ([dx, dy, w, h]) => R(x + dx, b - dy, w, h, '#4f8f4f'));
  },
};
DRAW.desk2 = DRAW.desk3 = DRAW.desk4 = DRAW.desk;

function sprite(x, y, colour, leg, eyes, px) {
  BODY.concat(LEGS[leg]).forEach((row, j) => {
    for (let i = 0; i < row.length; i++) {
      const c = row[i]; if (c === '.') continue;
      R(x + i * px, y + j * px, px, px, c === 'E' && eyes ? '#2b1d16' : colour);
    }
  });
}
DRAW.couch2 = DRAW.couch; DRAW.plant2 = DRAW.plant;

const LEISURE_SAY = {
  coffee: ['Ahh, coffee.', 'Coffee break!', 'One more cup.'], couch: ['Time to rest.', 'Feet up.', 'Nap time.'],
  plant: ['Water for you, plant.', 'Grow, little plant.'], shelf: ['A good book.', 'Light reading.'],
  board: ['Doodle time.', 'Drawing a cat.'], globe: ['Where next?', 'Holiday ideas.'],
  stretch: ['Stretch!', 'Good for the back.'], dance: ['Task done!', 'Victory dance!'], wander: ['La la la.', ''],
};
const LEISURE = ['coffee', 'couch', 'couch2', 'plant', 'plant2', 'shelf', 'board', 'globe', 'wander', 'stretch', 'dance'];
const FREE_SPOT = ['wander', 'stretch', 'dance'];
LEISURE_SAY.couch2 = LEISURE_SAY.couch; LEISURE_SAY.plant2 = LEISURE_SAY.plant;

// what Claude holds or does on a break
function drawProp(cr, kind, y, sw, sh, room) {
  const hx = cr.x + sw - 2, hy = y + sh * 0.45;
  if (kind === 'coffee') {
    const sip = (t % 160) < 30 ? -4 : 0;
    R(hx, hy + sip, 6, 7, '#e8e4dc'); R(hx + 6, hy + 2 + sip, 2, 3, '#e8e4dc'); R(hx + 1, hy + 1 + sip, 4, 2, '#6b4226');
    for (let i = 0; i < 2; i++) {
      const k = (t + i * 18) % 36; R(hx + 2 + i * 2 + Math.sin(k / 4), hy - 2 - k / 3 + sip, 1, 2, `rgba(255,255,255,${0.6 - k / 60})`);
    }
  } else if (kind === 'shelf') {
    R(hx - 2, hy, 10, 8, '#c0504d'); R(hx + 2, hy, 1, 8, '#f5f3ee');
  } else if (kind === 'plant') {
    R(cr.x - 10, hy, 9, 6, '#6A9BCC'); R(cr.x - 14, hy - 2, 5, 2, '#6A9BCC');
    for (let i = 0; i < 3; i++) { const k = (t + i * 7) % 20; R(cr.x - 15 - i, hy + k, 1, 2, '#8cc4ff'); }
  } else if (kind === 'board') {
    R(hx, hy - 6, 2, 8, '#c0504d');
  } else if (kind === 'globe') {
    if ((t >> 5) % 2) txt('?', cr.x + sw / 2, y - 4, '#d6d3cc', 11, 'center', '700');
  } else if (kind === 'dance') {
    const k = t % 60; txt('♪', cr.x + sw + 4 + k / 10, y - k / 4, `rgba(240,238,230,${1 - k / 60})`, 12);
  }
}

// ---------- layout ----------
function addSpot(key, kind, x, b, lane, pod) {
  const s = { key, kind, x, w: WIDTH[kind] || 24, b, lane, pod };
  spots[key] = s; items.push(s);
  return s;
}

function spread(keys, x0, x1, b, lane, prefix, pod) {
  const need = keys.reduce((a, k) => a + WIDTH[k], 0), gap = (x1 - x0 - need) / (keys.length + 1);
  let x = x0 + gap;
  keys.forEach(k => { addSpot(prefix + k, k, x, b, lane, pod); x += WIDTH[k] + gap; });
}

function layout(claudes) {
  spots = {}; items = []; lanes = [];
  const mains = claudes.filter(c => !c.parent);
  // back wall facilities; floor-standing ones move to a second row when the wall is full
  const avail = W - 2 * M - 40, need = ks => ks.reduce((a, k) => a + WIDTH[k] + 8, 0);
  let row0 = FAC.slice(); const row1 = [];
  for (const k of FAC_FLOOR) { if (need(row0) <= avail) break; row0 = row0.filter(x => x !== k); row1.unshift(k); }
  spread(row0, M, W - M - 40, BACK, LANE0, '', null);
  addSpot('door', 'door', W - M - 30, BACK, LANE0, null);
  lanes.push(LANE0);
  let y = LANE0 + 14;
  if (row1.length) { spread(row1, M, W - M, BACK + ROW, LANE0 + ROW, '', null); lanes.push(LANE0 + ROW); y += ROW; }
  // desk pods
  const cols = Math.max(1, Math.floor((W - 2 * M + PGAP) / (PW + PGAP)));
  const pw = (W - 2 * M - (cols - 1) * PGAP) / cols;
  aisles = [M + 4];
  for (let c = 1; c < cols; c++) aisles.push(M + c * (pw + PGAP) - PGAP / 2);
  aisles.push(W - M - 4);
  for (let r = 0; r * cols < mains.length; r++) {
    const line = mains.slice(r * cols, r * cols + cols);
    let lh = POD_H1;
    line.forEach((m, c) => {
      const helpers = claudes.filter(h => h.parent === m.id);
      const extra = Math.min(3, Math.max(Math.floor((m.rate || 0) / 12), helpers.length));
      const keys = ['desk', 'terminal', 'desk2', 'desk3', 'desk4'].slice(0, 2 + extra);
      const r1 = [], r2 = [];
      keys.forEach(k => (r1.length < 3 && need(r1.concat(k)) <= pw - 8 ? r1 : r2).push(k));
      const pod = { id: m.id, x: M + c * (pw + PGAP), y, w: pw, h: r2.length ? POD_H2 : POD_H1, main: m, helpers };
      pods.set(m.id, pod);
      spread(r1, pod.x, pod.x + pw, y + POD_B1, y + POD_L1, m.id + ':', pod);
      if (r2.length) spread(r2, pod.x, pod.x + pw, y + POD_B2, y + POD_L2, m.id + ':', pod);
      lanes.push(y + POD_L1); if (r2.length) lanes.push(y + POD_L2);
      lh = Math.max(lh, pod.h);
    });
    line.forEach(m => pods.get(m.id).h = lh);
    y += lh + PGAP;
  }
  for (const id of [...pods.keys()]) if (!mains.some(m => m.id === id)) pods.delete(id);
  // the lounge
  lounge = { y, h: LOUNGE_H };
  const many = mains.length > 2 && W > 520;
  spread(['plant', 'huddle', 'coffee', 'couch'].concat(many ? ['couch2', 'plant2'] : []),
    M, W - M, y + 64, y + 92, '', null);
  lanes.push(y + 92);
  return y + LOUNGE_H;
}

// ---------- where each Claude goes ----------
function pickLeisure(cr, first) {
  const opts = LEISURE.filter(k => FREE_SPOT.includes(k) || spots[k]);
  let k = first ? 'coffee' : opts[Math.random() * opts.length | 0];
  if (!first && k === cr.leisure && opts.length > 1) k = opts[(opts.indexOf(k) + 1) % opts.length];
  cr.leisure = k; cr.leisureT = 300 + Math.random() * 420 | 0; cr.said = false;
  cr.wx = M + 30 + Math.random() * (W - 2 * M - 60);
  cr.wy = lanes.length ? lanes[Math.random() * lanes.length | 0] : LANE0;
}

function goalOf(cr) {
  const c = cr.info, pod = c.parent || c.id;
  const own = k => spots[pod + ':' + k] ? pod + ':' + k : pod + ':desk';
  switch (c.state) {
    case 'working': {
      const st = stationFor(c.tool) || 'desk';
      if (st === 'desk' && c.parent) {  // helpers take the spare desks
        const free = ['desk2', 'desk3', 'desk4'].filter(k => spots[pod + ':' + k]);
        return free.length ? pod + ':' + free[cr.idx % free.length] : own('desk');
      }
      if (st === 'desk' || st === 'terminal') return own(st);
      return spots[st] ? st : own('desk');
    }
    case 'thinking': return 'board';
    case 'waiting': return own('desk');
    case 'error': return own('terminal');
    case 'off': return c.parent ? own('desk2') : own('desk');
    case 'done':
      if (!cr.leisure) pickLeisure(cr, true);
      return cr.leisure;
  }
  return own('desk');
}

function aim(cr) {
  cr.goal = goalOf(cr);
  let tx, ty;
  if (FREE_SPOT.includes(cr.goal)) { tx = cr.wx; ty = cr.wy; }
  else {
    const s = spots[cr.goal] || spots.door;
    tx = s.x + s.w / 2 + SLOTS[cr.slot % SLOTS.length]; ty = s.lane;
  }
  if (cr.tx === tx && cr.ty === ty) return;
  cr.tx = tx; cr.ty = ty;
  // walk along the current lane to an aisle, along the aisle, then along the target lane
  if (Math.abs(cr.y - ty) < 2) cr.path = [[tx, ty]];
  else {
    const mid = (cr.x + tx) / 2, ax = aisles.reduce((a, b) => Math.abs(b - mid) < Math.abs(a - mid) ? b : a, aisles[0]);
    cr.path = [[ax, cr.y], [ax, ty], [tx, ty]];
  }
}

function sync(claudes) {
  const mains = claudes.filter(c => !c.parent);
  mains.forEach(m => { if (!order.includes(m.id)) order.push(m.id); });
  order = order.filter(id => mains.some(m => m.id === id));
  const sorted = order.map(id => mains.find(m => m.id === id))
    .concat(claudes.filter(c => c.parent && order.includes(c.parent)));
  const h = layout(sorted);
  const seen = new Set(), used = {};
  sorted.forEach(c => {
    seen.add(c.id);
    let cr = critters.get(c.id);
    if (!cr) {
      const d = spots.door;
      cr = { x: d.x + d.w / 2, y: d.lane, path: [], hop: 0, say: '', sayT: 0, state: c.state };
      critters.set(c.id, cr);
    }
    if (cr.state !== c.state) {
      if (c.state === 'done') { cr.hop = 14; cr.say = 'Done!'; cr.sayT = 90; cr.leisure = null; }
      if (c.state === 'waiting') { cr.hop = 12; cr.say = 'Need you!'; cr.sayT = 140; }
      if (c.state === 'error') { cr.say = 'Oops'; cr.sayT = 70; }
    }
    cr.info = c; cr.state = c.state;
    cr.idx = c.parent ? sorted.filter(x => x.parent === c.parent).indexOf(c) : 0;
    const g = goalOf(cr);
    cr.slot = used[g] = (used[g] === undefined ? 0 : used[g] + 1);  // share a station side by side
    aim(cr);
  });
  for (const id of [...critters.keys()]) if (!seen.has(id)) critters.delete(id);
  if (h !== H) { H = h; resize(); }
}

function measure() {
  const cw = canvas.clientWidth || 300;
  S = Math.min(MAX_S, cw / MIN_W); W = cw / S;  // W is the logical width
}
function resize() {
  const r = window.devicePixelRatio || 1, cw = canvas.clientWidth || 300;
  measure();
  canvas.style.height = H * S + 'px';
  canvas.width = cw * r; canvas.height = H * S * r;
  ctx.setTransform(r * S, 0, 0, r * S, 0, 0);
}

// ---------- drawing ----------
function rug(x, y, w, h, colour, alpha, border) {
  ctx.globalAlpha = alpha; R(x, y, w, h, colour); ctx.globalAlpha = 1;
  ctx.strokeStyle = border; ctx.lineWidth = 1; ctx.strokeRect(Math.round(x) + 0.5, Math.round(y) + 0.5, w - 1, h - 1);
}

function drawShell() {
  // wall
  R(0, 0, W, WALL, '#2f3a46'); R(0, WALL - 4, W, 4, '#26303a');
  for (let x = 40; x < W; x += 120) R(x, 6, 1, WALL - 12, '#2a333e');  // wall panels
  // floor
  for (let fy = WALL, j = 0; fy < H; fy += 10, j++)
    for (let fx = 0, i = 0; fx < W; fx += 14, i++)
      R(fx, fy, Math.min(14, W - fx), Math.min(10, H - fy), (i + j) % 2 ? '#4a3f35' : '#443a31');
  R(0, WALL, W, 2, '#1f262e');
  // sign and clock
  ctx.font = '600 11px system-ui, Segoe UI, sans-serif';
  const n = pods.size, sign = `Claude Office  ${n} session${n === 1 ? '' : 's'}`;
  const sw = ctx.measureText(sign).width;
  R(M, 5, sw + 14, 15, '#1b2128'); txt(sign, M + 7, 16, '#f0eee6', 11, 'left', '600');
  const now = new Date(), clock = now.toTimeString().slice(0, 5);
  R(W - M - 46, 5, 46, 15, '#1b2128'); txt(clock, W - M - 23, 16, '#e0a43a', 11, 'center', '600');
  // the door
  const d = spots.door, open = [...critters.values()].some(c => c.info.state === 'waiting') && (t >> 6) % 2;
  R(d.x, 34, 24, BACK - 34, '#6e4a30'); R(d.x + 2, 36, 20, BACK - 36, open ? '#151719' : '#8a5a3c');
  if (!open) R(d.x + 17, 64, 3, 3, '#e0c070');
  // rugs: one per pod in its session's colour, and the lounge
  for (const pod of pods.values()) {
    const warn = pod.main.state === 'waiting' || pod.main.state === 'error';
    rug(pod.x, pod.y, pod.w, pod.h, pod.main.colour, 0.13, warn && (t >> 5) % 2 ? '#e0a43a' : pod.main.colour + '66');
  }
  rug(M, lounge.y, W - 2 * M, LOUNGE_H - 6, '#5f7a55', 0.16, '#5f7a5566');
  txt('Lounge', M + 6, lounge.y + 13, '#a3b39b', 10, 'left', '600');
}

function podLabel(pod) {
  const m = pod.main, x = pod.x + 7, w = pod.w - 14;
  R(x, pod.y + 6, 5, 5, m.colour);
  ctx.font = '600 11px system-ui';
  const name = fit(m.project, w * 0.6);
  txt(name, x + 9, pod.y + 13, '#f0eee6', 11, 'left', '600');
  ctx.font = '600 11px system-ui'; const nw = ctx.measureText(name).width;
  ctx.font = '10px system-ui';
  txt(fit(m.name, w - nw - 14), x + 14 + nw, pod.y + 13, '#a39e93', 10);
  const warn = m.state === 'waiting' || m.state === 'error';
  const head = m.word + (m.turn ? ' ' + m.turn : '');
  ctx.font = '600 10px system-ui'; const hw = ctx.measureText(head).width + 6;
  txt(head, x, pod.y + 26, warn ? '#e0a43a' : '#d6d3cc', 10, 'left', '600');
  ctx.font = '10px system-ui';
  txt(fit(m.step || '', w - hw), x + hw, pod.y + 26, '#a39e93', 10);
}

function litSet() {
  const lit = new Set();
  for (const cr of critters.values())
    if (!cr.path.length && cr.info.state !== 'off') lit.add(cr.goal);
  for (const pod of pods.values())
    if (pod.main.state === 'working') ['desk2', 'desk3', 'desk4'].forEach(k => lit.add(pod.id + ':' + k));
  return lit;
}

function drawCritter(cr) {
  const c = cr.info, px = c.parent ? 2 : 3, sw = 14 * px, sh = 9 * px;
  const speed = c.state === 'working' ? 2 : 1.3;
  if (cr.path.length) {
    const [px2, py2] = cr.path[0], dx = px2 - cr.x, dy = py2 - cr.y, d = Math.hypot(dx, dy);
    if (d <= speed) { cr.x = px2; cr.y = py2; cr.path.shift(); }
    else { cr.x += dx / d * speed; cr.y += dy / d * speed; }
  }
  const moving = cr.path.length > 0;
  if (cr.hop > 0) cr.hop--;
  const relax = !moving && c.state === 'done' ? cr.goal : '';
  if (relax) {
    if (!cr.said && cr.sayT <= 0) {
      const lines = LEISURE_SAY[relax] || [''], line = lines[Math.random() * lines.length | 0];
      if (line) { cr.say = line; cr.sayT = 80; }
      cr.said = true;
    }
    if (--cr.leisureT <= 0) { pickLeisure(cr); aim(cr); }
    if (relax === 'stretch' && cr.leisureT % 90 === 0) cr.hop = 14;
    if (relax === 'dance' && cr.leisureT % 24 === 0) { cr.hop = 8; cr.x += (cr.leisureT / 24 | 0) % 2 ? 4 : -4; }
  }
  const lift = cr.hop > 0 ? Math.sin(cr.hop / 14 * Math.PI) * 10 : 0;
  const atWork = !moving && c.state === 'working';
  const bob = atWork ? ((t >> 3) % 2) : c.state === 'thinking' ? Math.sin(t / 10) * 1.5 : 0;
  const sitting = relax === 'couch' || relax === 'couch2';
  const asleep = !moving && c.state === 'off';
  const left = cr.x - sw / 2;
  const y = (sitting ? cr.y - 36 : cr.y) - sh - lift + (sitting ? Math.sin(t / 30) : bob);
  const resting = (sitting && cr.leisureT < 240) || asleep;
  ctx.globalAlpha = c.state === 'off' ? 0.75 : 1;
  sprite(left, y, c.colour, moving ? (t >> 3) % 2 : 0, !resting && t % 200 > 5, px);
  ctx.globalAlpha = 1;
  cr.box = [left, y, sw, sh];
  if (relax) drawProp({ x: left }, relax, y, sw, sh);
  if (resting) txt((t >> 5) % 2 ? 'z' : 'Z', left + sw + 2, y - 2, '#a39e93', 10);
  if (c.state === 'thinking' && !moving)
    for (let k = 0; k < 3; k++) if ((t / 15 | 0) % 4 > k) R(cr.x - 6 + k * 5, y - 6, 2, 2, '#d6d3cc');
  if (c.state === 'waiting' && cr.sayT <= 0 && (t >> 4) % 2) txt('!', cr.x, y - 4, '#e0a43a', 14, 'center', '700');
  if (cr.sayT > 0) {
    cr.sayT--;
    ctx.font = '11px system-ui'; const tw = ctx.measureText(cr.say).width + 10;
    const bx = Math.min(Math.max(cr.x, tw / 2 + 2), W - tw / 2 - 2);
    R(bx - tw / 2, y - 22, tw, 16, '#f0eee6'); R(bx - 2, y - 6, 4, 3, '#f0eee6');
    txt(cr.say, bx, y - 10, '#1f1e1d', 11, 'center');
  }
}

function frame() {
  t++;
  ctx.clearRect(0, 0, W, H);
  if (!spots.door) { requestAnimationFrame(frame); return; }
  drawShell();
  for (const pod of pods.values()) podLabel(pod);
  const lit = litSet();
  // back to front: furniture by its base, Claudes by their feet
  const list = items.filter(s => s.kind !== 'door').map(s => ({ y: s.b, s }))
    .concat([...critters.values()].map(cr => ({ y: cr.y + 0.5, cr })));
  list.sort((a, b) => a.y - b.y);
  list.forEach(o => {
    if (o.s) { if (DRAW[o.s.kind]) DRAW[o.s.kind](o.s.x, o.s.b, lit.has(o.s.key), 0, items.indexOf(o.s)); }
    else drawCritter(o.cr);
  });
  if (!pods.size) txt('No Claude sessions active in the last 30 minutes.', W / 2, LANE0 + 40, '#a39e93', 12, 'center');
  hearts = hearts.filter(p => (p.y -= 0.6, p.t--, p.t > 0));
  hearts.forEach(p => { ctx.globalAlpha = p.t / 40; txt('♥', p.x, p.y, '#e5484d', 11, 'center'); });
  ctx.globalAlpha = 1;
  requestAnimationFrame(frame);
}

// ---------- mouse ----------
const esc = s => String(s).replace(/[&<>]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[ch]);
function at(e) {
  const r = canvas.getBoundingClientRect(), x = (e.clientX - r.left) / S, y = (e.clientY - r.top) / S;
  for (const cr of critters.values()) {
    const [bx, by, bw, bh] = cr.box || [];
    if (x >= bx - 4 && x <= bx + bw + 4 && y >= by - 6 && y <= by + bh + 4) return { cr };
  }
  for (const pod of pods.values())
    if (x >= pod.x && x <= pod.x + pod.w && y >= pod.y && y <= pod.y + 30) return { pod };
  for (const s of items)
    if (x >= s.x && x <= s.x + s.w && y >= s.b - 58 && y <= s.b) return { spot: s.kind === 'door' ? 'Door' : LABELS[s.kind] };
  return null;
}
canvas.addEventListener('click', e => {
  const hit = at(e); if (!hit || !hit.cr) return;
  const { cr } = hit, [bx, by, bw] = cr.box;
  cr.hop = 14; cr.say = PATS[Math.random() * PATS.length | 0]; cr.sayT = 90;
  for (let k = 0; k < 4; k++) hearts.push({ x: bx + bw / 2 + (k - 1.5) * 6, y: by - 4 - k * 3, t: 40 });
});
canvas.addEventListener('mousemove', e => {
  const hit = at(e);
  canvas.style.cursor = hit && hit.cr ? 'pointer' : 'default';
  if (!hit) { tip.style.display = 'none'; return; }
  let html;
  const card = c => `<b>${esc(c.name)}</b> ${esc(c.parent ? c.desc || 'helper' : c.project)}<br>${esc(c.word)}`
    + (c.turn ? ' ' + esc(c.turn) : '') + (c.step ? `<br>${esc(c.step)}` : '')
    + (c.context ? `<br>Context ${esc(c.context)}` : '') + `<br>${c.steps} steps, ${c.rate || 0} in the last 10 min`;
  if (hit.cr) html = card(hit.cr.info);
  else if (hit.pod) html = card(hit.pod.main) + (hit.pod.helpers.length ? `<br>${hit.pod.helpers.length} helper(s)` : '');
  else html = hit.spot;
  tip.innerHTML = html; tip.style.display = 'block';
  tip.style.left = Math.min(e.clientX + 12, innerWidth - 270) + 'px'; tip.style.top = (e.clientY + 14) + 'px';
});
canvas.addEventListener('mouseleave', () => tip.style.display = 'none');
window.addEventListener('resize', () => { measure(); if (last) sync(last); resize(); });

// ?demo: made-up sessions that change tools every few seconds, to preview a busy office
const DEMO_TOOLS = ['Edit', 'Bash', 'Read', 'Grep', 'WebSearch', 'mcp__Claude_Browser__computer', 'Agent',
  'mcp__calendar__create_event', 'mcp__gmail__create_draft', 'Artifact', 'Skill', 'mcp__ccd_turn__update_plan'];
function demo() {
  const k = Math.floor(Date.now() / 4000), pick = n => DEMO_TOOLS[(k + n) % DEMO_TOOLS.length];
  const states = ['working', 'working', 'working', 'thinking', 'waiting', 'done', 'off'];
  const mk = (id, name, project, colour, n, extra) => {
    const state = id === 'a' ? 'working' : states[(k + n) % states.length], tool = state === 'working' ? pick(n) : '';
    return Object.assign({ id, parent: '', name, project, colour, state, tool, word: state, turn: '2m 10s',
      step: tool, steps: 40 + n, rate: 6 + n * 7, names: [], kinds: {}, context: '' }, extra);
  };
  return [
    mk('a', 'Opus 5.5', 'Busy Project', '#D97757', 3),
    mk('b', 'Sonnet 5.5', 'Website', '#6A9BCC', 1),
    mk('c', 'Haiku 5.5', 'Scripts', '#7FA36B', 4),
    mk('a1', 'Explore', '', '#D97757', 5, { parent: 'a', desc: 'Find the API routes' }),
    mk('a2', 'Plan', '', '#D97757', 2, { parent: 'a', desc: 'Plan the refactor' }),
  ];
}

async function poll() {
  if (location.search.includes('demo')) { measure(); sync(last = demo()); setTimeout(poll, 1500); return; }
  try {
    const d = await (await fetch('/state', { cache: 'no-store' })).json();
    measure(); sync(last = d.claudes);
  } catch (e) {
    // server stopped: the desktop app window (opened with ?app) closes itself; elsewhere keep the last picture
    if (location.search.includes('app')) window.close();
  }
  setTimeout(poll, 1500);
}
resize(); poll(); frame();
</script>
