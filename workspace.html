  }
  $('sFind').addEventListener('click', findCity);
  $('sCity').addEventListener('keydown', e => { if (e.key === 'Enter') findCity(); });
  $('sReset').addEventListener('click', () => { Object.assign(cfg, DEFAULTS); fillPanel(); fetchWeather(); applyScreen(); saveSettings(); });
  $('sClose').addEventListener('click', closeSettings);
  panel.addEventListener('pointerdown', e => { if (e.target === panel) closeSettings(); });
  addEventListener('keydown', e => { if (e.key === 'Escape') closeSettings(); });
}

// ---------- Screen: brightness, pixel shift, full screen, keeping awake, keys ----------

// Brightness only darkens this page (a page cannot set the screen's own); on an OLED darker pixels
// also wear less. Pixel shift moves the whole room a few screen pixels every two minutes, so the
// still edges (window, shelf, clock) do not sit on the same pixels all day.
const SHIFTS = [[0, 0], [2, 0], [2, 2], [0, 2], [-2, 2], [-2, 0], [-2, -2], [0, -2], [2, -2]];
const SHIFT_SECS = 120;

function applyScreen() {
  $('dim').style.opacity = String(1 - Math.min(100, Math.max(30, cfg.brightness || 100)) / 100);
  resize();
  keepAwake();
}

function pixelShift() {
  const [dx, dy] = cfg.shift ? SHIFTS[Math.floor(Date.now() / 1000 / SHIFT_SECS) % SHIFTS.length] : [0, 0];
  canvas.style.transform = dx || dy ? `translate(${dx}px, ${dy}px)` : '';
}

function toggleFull() {
  if (!document.fullscreenEnabled) return;
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  else document.documentElement.requestFullscreen().catch(() => {});
}

document.addEventListener('fullscreenchange', () => {
  resize();
  $('sFull').textContent = document.fullscreenElement ? 'LEAVE FULL SCREEN' : 'FULL SCREEN';
});

// The browser lets go of the wake lock whenever the page is hidden, so it is asked for again on return
let wake = null;
async function keepAwake() {
  if (!cfg.awake || !('wakeLock' in navigator) || document.hidden) {
    if (wake) { wake.release().catch(() => {}); wake = null; }
    return;
  }
  if (wake && !wake.released) return;
  try { wake = await navigator.wakeLock.request('screen'); } catch (e) { wake = null; }
}
document.addEventListener('visibilitychange', keepAwake);

addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey || e.repeat || e.target.closest('input, select, textarea')) return;
  const k = e.key.toLowerCase();
  if (k === 'f') toggleFull();
  else if (k === 's') panel.classList.contains('open') ? closeSettings() : openSettings();
  else if (k === 'm') { cfg.sound = !cfg.sound; $('sSound').checked = cfg.sound; soundOn(); saveSettings(); }
  else if (k === '[' || k === ']') {
    cfg.brightness = Math.min(100, Math.max(30, cfg.brightness + (k === ']' ? 10 : -10)));
    $('sBright').value = String(cfg.brightness);
    applyScreen();
    saveSettings();
  }
  else return;
  e.preventDefault();
});

// ---------- Session list (shown under the room in tall panels) ----------

function el(tag, cls, str) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (str) e.textContent = str;
  return e;
}

function renderList(list) {
  listEl.replaceChildren();
  if (!list.length) {
    listEl.append(el('div', 'empty', world.ready ? 'No active Claude Code sessions right now.' : 'Reading sessions...'));
    return;
  }
  for (const c of list) {
    const row = el('div', 'row'), dot = el('div', 'dot'), body = el('div');
    dot.style.background = c.colour || C.amber;
    body.append(el('span', 'name', (c.parent ? '  ' : '') + (c.name || 'Claude') + (c.project ? ' . ' + c.project : '')),
      document.createTextNode(' '), el('span', 'state', c.word || c.state || ''));
    if (c.step || c.desc) body.append(el('div', 'step', c.step || c.desc));
    row.append(dot, body);
    listEl.append(row);
  }
}

// ---------- Room and lighting ----------

function cloudX(cl, t) { return -10 + ((t * cl.speed * (0.6 + weather.wind / 12) + cl.offset) % 130); }

function bodyCovered(t, s) {
  return clouds.some(cl => Math.abs(22 + cloudX(cl, t) - s.body.x) < 9 && Math.abs(cl.y - s.body.y) < 8);
}

// Each view has its own wall: [base, lines, light], where light also tints the monitor and portal glow
const WALLS = {
  city:     [C.night,   C.navy,    C.navy],
  mountain: ['#2a1a11', '#170e09', '#3d2718'],
  ice:      ['#172748', '#26406a', '#2c4a78'],
  shore:    ['#163242', '#0e2230', '#22495c'],
  village:  ['#2c2322', '#3f2a1c', '#3a2f2c'],
  desert:   ['#36231a', '#4b3224', '#4b3224'],
  forest:   ['#13221a', '#0a130e', '#22382a']
};
const wallLight = () => WALLS[currentView()][2];

function drawRoom() {
  const v = currentView(), [base, lines, light] = WALLS[v];
  rect(base, 0, 0, W, H);
  if (v === 'city') for (let x = 6; x < W; x += 24) rect(lines, x, 0, 1, 150); // wall panels
  else if (v === 'mountain') for (let y = 0; y < 150; y += 8) { // stacked logs with knots
    rect(light, 0, y, W, 1); rect(lines, 0, y + 7, W, 1);
    for (let x = (y * 7) % 37; x < W; x += 61) { px(lines, x, y + 3); px(lines, x + 1, y + 4); }
  }
  else if (v === 'ice') for (let y = 0; y < 150; y += 10) { // blocks of ice with a glint here and there
    rect(lines, 0, y, W, 1);
    for (let x = (y / 10) % 2 * 12; x < W; x += 24) {
      rect(lines, x, y, 1, 10);
      if (hash(x * 3 + y) > 0.6) { px(light, x + 3, y + 2); px(light, x + 4, y + 2); px(light, x + 3, y + 3); }
    }
  }
  else if (v === 'shore') for (let x = 0; x < W; x += 10) { // painted planks, nailed top and bottom
    rect(lines, x, 0, 1, 150); rect(light, x + 1, 0, 1, 150);
    px(light, x + 5, 4); px(light, x + 5, 144);
  }
  else if (v === 'village') { // plaster between timber beams
    for (let i = 0; i < 260; i++) px(light, hash(i * 1.3) * W, hash(i * 2.9) * 150);
    rect(lines, 0, 4, W, 3); rect(lines, 0, 144, W, 3);
    for (let x = 0; x < W; x += 64) {
      rect(lines, x, 4, 3, 143);
      line(lines, x + 3, 144, x + 30, 112, R); line(lines, x + 61, 144, x + 34, 112, R);
    }
  }
  else if (v === 'desert') for (let y = 0; y < 150; y += 6) { // adobe bricks
    rect(lines, 0, y, W, 1);
    for (let x = (y / 6) % 2 * 7; x < W; x += 14) rect(lines, x, y, 1, 6);
  }
  else if (v === 'forest') for (let x = 0; x < W; x += 7) { // dark boards with moss creeping up
    rect(lines, x, 0, 1, 150);
    for (let y = 150 - 1; y > 128; y--) if (hash(x * 11 + y) > 0.55 + (150 - y) * 0.02) px(light, x + 1 + Math.floor(hash(x + y) * 5), y);
  }
  rect(C.wood, 0, 150, W, H - 150);                              // floor
  rect(C.oak, 0, 150, W, 2);                                     // baseboard
  for (let y = 158; y < H; y += 8) rect(C.oak, 0, y, W, 1);      // floor planks
  for (let i = 0; i < 18; i++) rect(C.oak, (i * 53 + (i % 2) * 20) % W, 152 + (i % 4) * 8 + 1, 1, 7);
}

function drawLights(t, s) {
  glow(wallLight(), 172, 100, 78, 36);                                                   // monitor glow
  const pr = Math.round(26 * portalSize());
  if (pr > 3) glow(world.portalFlare > 0 ? C.green : wallLight(), PORTAL.x, PORTAL.y, pr, pr, 0.35); // portal glow
  if (lightning()) glow(C.blue, 66, 110, 80, 60, 0.6);
  if (callQueue().some(a => a.arrived) && Math.floor(t * 4) % 2) glow(C.amber, COMM.x + 21, 140, 14, 10, 0); // intercom beacon
  // Sunlight or moonlight on the floor, dimmer at twilight, under clouds or a thin moon, gone in rain
  if (wet()) return;
  const weak = s.twilight || dull() || bodyCovered(t, s) || (!s.day && moonLight() < 0.3);
  const step = weak ? 8 : 4, color = s.day || s.twilight ? C.amber : C.blue;
  for (let y = 153; y < H; y += 2)
    for (let x = 30 - (y - 153); x < 100 - (y - 153); x++)
      if ((x + (y % 4 === 1 ? step / 2 : 0)) % step === 0) px(color, x, y);
}

// ---------- Window ----------

function drawWindow(t, sk) {
  const x = 22, y = 20, w = 88, h = 70;
  const bright = sk.day && !sk.twilight;
  rect(C.oak, x - 3, y - 3, w + 6, h + 6);
  rect(lightning() ? C.white : bright && !wet() ? C.blue : C.navy, x, y, w, h);
  // Grey skies: pale over blue when overcast, dim over navy when raining by day
  if (bright && dull() && !lightning())
    for (let yy = y; yy < y + h; yy++)
      for (let xx = x; xx < x + w; xx++)
        if ((xx + yy) % 2 === 0) px(wet() ? C.blue : C.white, xx, yy);

  // Horizon: warm glow at sunrise and sunset, pale haze by day
  for (let yy = y + h - 30; yy < y + h; yy++)
    for (let xx = x; xx < x + w; xx++) {
      const low = yy > y + h - 14;
      if (sk.twilight && (low ? (xx + yy) % 2 === 0 : xx % 2 === 0 && yy % 2 === 0)) px(C.amber, xx, yy);
      else if (bright && low && xx % 2 === 0 && yy % 2 === 0) px(C.white, xx, yy);
    }

  if (!sk.day && !dull()) stars.forEach((s, i) => {
    if (sk.twilight && i % 2) return; // only the brightest stars at dusk and dawn
    const v = Math.sin(t * s.speed + s.phase);
    if (v > -0.4) px(v > 0.5 ? C.white : C.blue, s.x, s.y);
    if (v > 0.9) { px(C.blue, s.x - 1, s.y); px(C.blue, s.x + 1, s.y); px(C.blue, s.x, s.y - 1); px(C.blue, s.x, s.y + 1); }
  });

  ctx.save();
  ctx.beginPath(); ctx.rect(x * R, y * R, w * R, h * R); ctx.clip();
  if (!dull()) {
    if (sk.day) drawSun(sk.body.x, sk.body.y, sk.twilight);
    else drawMoon(sk.body.x, sk.body.y, 8, moonPhase());
  }
  const cloudColor = wet() ? (sk.day ? C.navy : C.night) : sk.day ? C.white : C.blue;
  for (const cl of clouds.slice(0, cloudCount())) blob(cloudColor, x + cloudX(cl, t), cl.y, cl.w, true);
  if (!wet()) drawPlane(t);
  drawMeteor();
  if (storm.flash > 0.2) for (let i = 1; i < storm.bolt.length; i++) line(C.white, ...storm.bolt[i - 1], ...storm.bolt[i], R);
  ctx.restore();

  drawView(y + h, t, sk);

  ctx.save();
  ctx.beginPath(); ctx.rect(x * R, y * R, w * R, h * R); ctx.clip();
  if (weather.kind === 'fog')
    for (let yy = y; yy < y + h; yy++)
      for (let xx = x; xx < x + w; xx++)
        if (yy > y + h - 30 ? (xx + yy) % 2 === 0 : xx % 2 === 0 && yy % 2 === 0) px(sk.day ? C.white : C.blue, xx, yy);
  for (const d of drops) {
    if (d.snow) px(C.white, d.x, d.y);
    else line(sk.day ? C.white : C.blue, d.x, d.y, d.x - d.vx * 0.03, d.y - 4);
  }
  ctx.restore();

  line(C.blue, x + 4, y + 10, x + 10, y + 4);
  line(C.blue, x + 48, y + 46, x + 52, y + 42);
  rect(C.oak, x + w / 2 - 1, y, 2, h);
  rect(C.oak, x, y + h / 2 - 1, w, 2);
  rect(C.wood, x - 5, y + h + 3, w + 10, 3);
  if (shown('touches')) drawSill(x + 6, y + h + 3);
}

// Moon drawn in its real phase: lit side on the right while waxing, left while waning
function drawMoon(cx, cy, r, phase) {
  cx = Math.round(cx); cy = Math.round(cy);
  if (moonLight() > 0.3) glow(C.blue, cx, cy, r + 5, r + 5);
  const k = Math.cos(phase * 2 * Math.PI);
  const craters = [[-3, -2], [2, 1], [-1, 3], [3, -4], [-4, 2], [4, 4], [1, -2], [2, -2], [1, -1], [2, -1]];
  for (let dy = -r; dy <= r; dy++)
    for (let dx = -r; dx <= r; dx++) {
      if (dx * dx + dy * dy > r * r) continue;
      const nx = dx / r, ny = dy / r, side = phase < 0.5 ? nx : -nx;
      const lit = side > k * Math.sqrt(1 - ny * ny);
      const crater = craters.some(([a, b]) => a === dx && b === dy);
      px(lit ? (crater ? C.blue : C.white) : C.night, cx + dx, cy + dy);
    }
}

function drawSun(cx, cy, low) {
  cx = Math.round(cx); cy = Math.round(cy);
  glow(low ? C.amber : C.white, cx, cy, 13, 13, 0);
  for (let dy = -6; dy <= 6; dy++)
    for (let dx = -6; dx <= 6; dx++) {
      const d = dx * dx + dy * dy;
      if (d <= 36) px(d <= 12 && !low ? C.white : C.amber, cx + dx, cy + dy);
    }
}

// A plane crosses the sky every 45 seconds with blinking lights
function drawPlane(t) {
  const x = 10 + (t * 5) % 225, y = 26 + x * 0.04;
  px(C.white, x, y);
  if (Math.floor(t * 2) % 2) px(C.amber, x + 2, y);
}

function drawMeteor() {
  if (!meteor.active) return;
  for (let k = 5; k >= 0; k--)
    px(k ? C.blue : C.white, meteor.x - meteor.vx * k * 0.012, meteor.y - meteor.vy * k * 0.012);
}

function drawSkyline(bottom, t, sk) {
  const r = rng(3);
  let i = 0;
  const bright = sk.day && !sk.twilight;
  for (const [bx, bw, bh] of buildings) {
    rect(bright ? C.navy : C.night, bx, bottom - bh, bw, bh);
    for (let wy = bottom - bh + 3; wy < bottom - 2; wy += 4)
      for (let wx = bx + 2; wx < bx + bw - 2; wx += 3) {
        const v = r();
        if (bright) { if (v < 0.35) px(C.blue, wx, wy); continue; } // glass reflecting the sky
        const flip = hash(i++ * 13 + Math.floor(t / 2)) > 0.98;    // someone switches a light
        if ((v < sk.lights) !== flip) px(C.amber, wx, wy);
      }
  }
  rect(C.night, 59, bottom - 40, 1, 6);
  if (Math.sin(t * 2) > 0.6) px(C.amber, 59, bottom - 41);
}

function drawCactus(x, sill) {
  rect(C.oak, x, sill - 4, 6, 4);
  rect(C.wood, x, sill - 4, 6, 1);
  rect(C.green, x + 2, sill - 11, 2, 7);
  rect(C.green, x + 4, sill - 9, 1, 3);
  rect(C.green, x + 1, sill - 8, 1, 2);
}

// ---------- Views: what the window looks out on, with small touches in the room to match ----------

const VIEWS = ['city', 'mountain', 'ice', 'shore', 'village', 'desert', 'forest'];
// Colours only the views use, as [day, night]; the room itself keeps the main palette
const V = {
  haze:  ['#8fa6c8', '#28335e'], rock:  ['#5b6e96', '#1b2447'],
  pine:  ['#3a6e50', '#13281f'], pineD: ['#24483a', '#0a1713'], leaf: ['#5c9a58', '#2a4a34'],
  ice:   ['#e4f2fa', '#6a80b0'], iceD:  ['#9cc4e0', '#35447a'], lake: ['#b4dcf0', '#1d2a55'],
  sea:   ['#2f7aa8', '#13284d'], foam:  ['#cfe8f2', '#4a6a9a'],
  sand:  ['#e3c088', '#4a3e58'], dune:  ['#c8955a', '#342a48'], cactus: ['#4f7f3c', '#1a2a24'],
  grass: ['#5f9a4e', '#1b3326'], field: ['#a6c060', '#26422c'], roof: ['#b0573c', '#3a2234'], wall: ['#efe2c4', '#3c3654']
};
let viewDay = true;
const tone = k => V[k][viewDay ? 0 : 1];

// The chosen view; 'random' picks a new one each day (room time), ?view=forest previews one
function currentView() {
  const v = params.get('view') || cfg.view;
  if (v === 'random') return VIEWS[hashText(roomNow().toISOString().slice(0, 10)) % VIEWS.length];
  return VIEWS.includes(v) ? v : 'city';
}

// Ground and ridges: fill each column from a height down to the sill
function fillDown(color, top, bottom, x0 = 22, x1 = 110) {
  for (let x = x0; x < x1; x++) { const y = Math.round(top(x)); if (y < bottom) rect(color, x, y, 1, bottom - y); }
}

function ridgeY(pts, x) {
  for (let i = 0; i < pts.length - 1; i++) {
    const [ax, ay] = pts[i], [bx, by] = pts[i + 1];
    if (x >= ax && x <= bx) return ay + (by - ay) * (x - ax) / (bx - ax);
  }
  return pts[pts.length - 1][1];
}

function pine(color, x, base, h) {
  for (let i = 0; i < h - 1; i++) {
    const w = Math.max(1, 1 + 2 * Math.floor(i * 0.3) - (i % 4 === 0 && i ? 2 : 0));
    rect(color, x - (w - 1) / 2, base - h + i, w, 1);
  }
  rect(color, x, base - 1, 1, 1);
}

// Smoke curling up from a chimney, drifting with the wind
function smoke(x, y, t, n = 6) {
  for (let i = 0; i < n; i++) {
    const k = (t * 0.25 + i / n) % 1;
    px(viewDay ? C.white : C.blue, x + Math.sin(k * 7 + i) * 1.2 + k * weather.wind / 3, y - k * 10);
  }
}

function drawView(b, t, sk) {
  viewDay = sk.day && !sk.twilight;
  const v = currentView();
  if (v === 'city') return drawSkyline(b, t, sk);
  ctx.save();
  ctx.beginPath(); ctx.rect(22 * R, 20 * R, 88 * R, (b - 20) * R); ctx.clip();
  ({ mountain: viewMountain, ice: viewIce, shore: viewShore, village: viewVillage, desert: viewDesert, forest: viewForest })[v](b, t, sk);
  ctx.restore();
}

function viewMountain(b, t, sk) {
  const far = [[22, 58], [30, 50], [38, 40], [47, 52], [56, 44], [66, 30], [78, 48], [88, 38], [98, 50], [110, 42]];
  fillDown(tone('haze'), x => ridgeY(far, x), b);
  for (let x = 22; x < 110; x++) { // snow on the high peaks
    const y = Math.round(ridgeY(far, x));
    if (y < 47) rect(viewDay ? C.white : C.blue, x, y, 1, Math.min(47 - y, 3 + Math.floor(hash(x) * 4)));
  }
  const mid = [[22, 68], [34, 60], [46, 69], [60, 57], [74, 67], [88, 61], [110, 71]];
  fillDown(tone('rock'), x => ridgeY(mid, x), b);
  for (const [x, h] of [[25, 9], [31, 12], [44, 8], [53, 10], [61, 12], [67, 9], [100, 12], [106, 9]]) pine(tone('pine'), x, b - 3, h);
  // a cabin in the trees with its lamp on after dark
  const cx = 78, cy = b - 4;
  rect(viewDay ? C.oak : C.wood, cx, cy - 7, 12, 7);
  for (let i = 0; i < 5; i++) rect(tone('roof'), cx - 1 + i, cy - 8 - i, 14 - i * 2, 1);
  rect(tone('roof'), cx + 9, cy - 12, 2, 4);
  smoke(cx + 10, cy - 13, t);
  rect(sk.lights > 0 ? C.amber : C.navy, cx + 3, cy - 5, 2, 2);
  rect(viewDay ? C.wood : C.night, cx + 7, cy - 5, 2, 5);
  for (const [x, h] of [[23, 12], [36, 15], [48, 11], [72, 13], [94, 16], [109, 12]]) pine(tone('pineD'), x, b, h);
}

function viewIce(b, t, sk) {
  const lake = b - 12;
  if (!sk.day && !dull()) // aurora on clear nights
    for (let x = 22; x < 110; x++) {
      const yc = 25 + Math.sin(x * 0.08 + t * 0.35) * 4 + Math.sin(x * 0.21 - t * 0.6) * 2, glowing = Math.sin(x * 0.05 - t * 0.5) > -0.3;
      for (let k = 0; k < 9; k++)
        if (glowing && (x + k) % 2 === 0 && hash(x * 7 + k * 13 + Math.floor(t * 1.5)) > 0.35 + k * 0.06) px(k < 3 ? C.green : C.blue, x, yc + k);
    }
  const peaks = [[22, 58], [29, 48], [35, 54], [43, 38], [51, 54], [59, 46], [67, 34], [77, 54], [85, 44], [93, 56], [101, 42], [110, 50]];
  fillDown(tone('iceD'), x => ridgeY(peaks, x), lake);
  for (let x = 22; x < 110; x++) { // sunlit faces on the left of each peak
    const y = ridgeY(peaks, x);
    if (ridgeY(peaks, x + 1) < y) rect(tone('ice'), x, Math.round(y), 1, Math.round((lake - y) * 0.55));
  }
  // frozen lake with the peaks mirrored in it
  rect(tone('lake'), 22, lake, 88, 12);
  for (let x = 22; x < 110; x++) {
    const depth = Math.min(10, Math.round((lake - ridgeY(peaks, x)) * 0.22));
    for (let y = lake; y < lake + depth; y++) if ((x + y) % 2 === 0) px(tone('iceD'), x, y);
  }
  for (const [x, y, w] of [[30, lake + 4, 9], [62, lake + 7, 12], [88, lake + 3, 7]]) rect(viewDay ? C.white : C.blue, x, y, w, 1);
  fillDown(viewDay ? C.white : tone('ice'), x => b - 3 + Math.sin(x * 0.3) * 1.2, b);
}

function viewShore(b, t, sk) {
  const sea = 66, beach = b - 6;
  rect(tone('sea'), 22, sea, 88, beach - sea);
  for (let y = sea + 1; y < beach; y += 3) { // rolling waves, faster nearer the beach
    const off = Math.floor(t * (1.5 + (y - sea) * 0.25));
    for (let x = 22; x < 110; x++) if ((x + off + y * 7) % 13 < 2) px(tone('foam'), x, y);
  }
  if (!dull() && (sk.day || moonLight() > 0.3)) // the sun or moon glittering on the water
    for (let y = sea + 1; y < beach; y++) if ((y + Math.floor(t * 4)) % 2 === 0) px(C.white, sk.body.x + Math.round(Math.sin(y * 1.7 + t * 3) * 2), y);
  // a sailboat crossing the bay
  const bx = 12 + (t * 1.6) % 120, by = sea + 6;
  rect(viewDay ? C.oak : C.wood, bx, by, 8, 2);
  rect(viewDay ? C.wood : C.night, bx + 1, by + 2, 6, 1);
  rect(C.night, bx + 4, by - 9, 1, 9);
  for (let i = 0; i < 8; i++) rect(viewDay ? C.white : C.blue, bx + 5, by - 9 + i, Math.ceil(i * 0.45), 1);
  // the lighthouse on its rock, sweeping a beam at night
  const lx = 100;
  fillDown(viewDay ? C.navy : C.night, x => sea + 6 + Math.abs(x - lx) * 0.6, beach, 88, 110);
  for (let i = 0; i < 18; i++) rect(Math.floor(i / 4) % 2 ? C.amber : C.white, lx - 1 - Math.floor(i / 9), sea - 12 + i, 3 + Math.floor(i / 9) * 2, 1);
  rect(C.night, lx - 3, sea - 13, 7, 1);
  rect(C.night, lx - 2, sea - 17, 5, 1); px(C.night, lx, sea - 18);
  const a = t * 1.1, dir = Math.cos(a), lit = !viewDay;
  rect(lit ? C.amber : C.white, lx - 1, sea - 16, 3, 3);
  px(C.night, lx - 2, sea - 16); px(C.night, lx + 2, sea - 16); px(C.night, lx - 2, sea - 14); px(C.night, lx + 2, sea - 14);
  if (lit) {
    const len = Math.abs(dir) * 46;
    for (let k = 2; k < len; k++)
      for (let j = -Math.floor(k * 0.1); j <= Math.floor(k * 0.1); j++)
        if ((k + j) % 2 === 0 && (j || k % 2 === 0)) px(C.white, lx + Math.sign(dir) * k, sea - 15 + j);
    if (Math.abs(dir) < 0.2) glow(C.white, lx, sea - 15, 5, 5, 0.4);
  }
  // the beach, with waves washing up
  rect(tone('sand'), 22, beach, 88, b - beach);
  for (let x = 22; x < 110; x++) if (Math.sin(t * 1.2 + x * 0.15) > 0.5) px(tone('foam'), x, beach);
  for (const x of [34, 58, 73]) px(viewDay ? C.white : C.blue, x, beach + 3);
}

function viewVillage(b, t, sk) {
  const back = [[22, 60], [45, 54], [70, 60], [95, 52], [110, 56]];
  fillDown(tone('field'), x => ridgeY(back, x), b);
  for (let x = 22; x < 110; x++) // rows of crops on the far hill
    for (let y = Math.round(ridgeY(back, x)) + 2; y < 70; y += 3) if ((x + y) % 2 === 0) px(tone('grass'), x, y);
  fillDown(tone('grass'), x => 70 + Math.sin(x * 0.07 + 1) * 3, b);
  // a windmill turning in the wind
  const wx = 34, wy = 56;
  fillDown(viewDay ? C.white : tone('wall'), x => wy + Math.abs(x - wx - 0.5) * 3, b - 14, wx - 2, wx + 4);
  rect(tone('roof'), wx - 1, wy - 1, 4, 2);
  const spin = t * (0.6 + weather.wind / 15);
  for (let i = 0; i < 4; i++) {
    const a = spin + i * Math.PI / 2;
    line(viewDay ? C.wood : C.navy, wx + 1, wy, wx + 1 + Math.cos(a) * 9, wy + Math.sin(a) * 9, R);
  }
  // houses with smoking chimneys; their lights go out late at night, like the city's
  let i = 0;
  for (const [hx, w, h, chimney] of [[48, 9, 6, 1], [60, 11, 7, 0], [74, 8, 5, 1], [86, 10, 7, 0], [99, 9, 6, 1]]) {
    const base = b - 3 - (hx % 3);
    rect(tone('wall'), hx, base - h, w, h);
    for (let r = 0; r < Math.ceil(w / 2) + 1; r++) rect(tone('roof'), hx - 1 + r, base - h - 1 - r, w + 2 - r * 2, 1);
    if (chimney) { rect(tone('roof'), hx + w - 3, base - h - 4, 2, 3); smoke(hx + w - 2, base - h - 5, t + hx, 5); }
    const on = (hash(hx) < sk.lights * 2.4) !== (hash(i++ * 13 + Math.floor(t / 3)) > 0.985);
    rect(on ? C.amber : viewDay ? C.blue : C.night, hx + 2, base - h + 2, 2, 2);
    rect(viewDay ? C.oak : C.wood, hx + w - 4, base - 3, 2, 3);
  }
  // a lamp post on the lane
  rect(C.night, 70, b - 12, 1, 10);
  px(viewDay ? C.white : C.amber, 70, b - 13);
  if (!viewDay) glow(C.amber, 70, b - 12, 5, 4, 0.3);
  for (let x = 22; x < 110; x += 4) { rect(viewDay ? C.oak : C.wood, x, b - 3, 1, 3); } // fence
  rect(viewDay ? C.oak : C.wood, 22, b - 2, 88, 1);
}

const desertStars = Array.from({ length: 34 }, (_, i) => ({ x: 23 + hash(i * 3.1) * 86, y: 21 + hash(i * 7.7) * 40, p: i }));
function viewDesert(b, t, sk) {
  if (!sk.day && !dull()) // no city lights out here: far more stars
    for (const s of desertStars) if (Math.sin(t * (1 + s.p % 3) + s.p) > -0.2) px(s.p % 4 ? C.blue : C.white, s.x, s.y);
  const far = x => 64 + Math.sin(x * 0.08) * 4 + Math.sin(x * 0.21) * 2;
  fillDown(tone('dune'), far, b);
  const near = x => 75 + Math.sin(x * 0.06 + 1) * 5;
  fillDown(tone('sand'), near, b);
  for (let x = 22; x < 110; x++) // the shaded side of each dune
    if (near(x + 1) > near(x)) for (let y = Math.round(near(x)); y < b; y++) if ((x + y) % 2 === 0) px(tone('dune'), x, y);
  for (const [x, h] of [[40, 11], [86, 15], [100, 7]]) {
    const base = Math.round(near(x)) + 2, c = tone('cactus');
    rect(c, x, base - h, 2, h);
    rect(c, x - 2, base - h + 4, 2, 1); rect(c, x - 2, base - h + 1, 1, 3);
    if (h > 9) { rect(c, x + 2, base - h + 6, 2, 1); rect(c, x + 3, base - h + 3, 1, 3); }
  }
}

function viewForest(b, t, sk) {
  if (viewDay && !wet()) for (let i = 0; i < 3; i++) { // birds crossing
    const x = 14 + (t * 6 + i * 37) % 110, y = 32 + i * 6 + Math.sin(t * 2 + i) * 1.5, up = Math.floor(t * 6 + i) % 2;
    px(C.night, x, y); px(C.night, x - 1, y - up); px(C.night, x + 1, y - up);
  }
  for (let x = 20; x < 114; x += 4) pine(tone('pine'), x + Math.floor(hash(x) * 3), b - 8, 18 + Math.floor(hash(x * 2.3) * 12));
  rect(tone('pineD'), 22, b - 9, 88, 9);
  for (let x = 19; x < 114; x += 7) pine(tone('pineD'), x + Math.floor(hash(x * 5) * 3), b, 24 + Math.floor(hash(x * 1.7) * 14));
  if (!sk.day) for (let i = 0; i < 10; i++) { // fireflies between the trees
    const x = 26 + (i * 37) % 80 + Math.sin(t * 0.7 + i) * 4, y = 64 + (i * 13) % 20 + Math.sin(t * 1.1 + i * 2) * 3;
    if (Math.sin(t * 2 + i * 1.3) > 0.2) { px('#d8f06a', x, y); if (Math.sin(t * 2 + i * 1.3) > 0.85) glow('#d8f06a', Math.round(x), Math.round(y), 2, 2, 0.5); }
  }
}

// On the windowsill: a little something from outside
function drawSill(x, sill) {
  const v = currentView();
  if (v === 'city' || v === 'desert') {
    drawCactus(x, sill);
    if (v === 'desert') { rect(C.oak, x + 9, sill - 3, 4, 3); rect(C.green, x + 10, sill - 6, 2, 3); px(C.amber, x + 10, sill - 7); }
    return;
  }
  if (v === 'mountain' || v === 'forest') { // a sapling or a fern in a pot
    rect(C.oak, x, sill - 4, 6, 4);
    rect(C.wood, x, sill - 4, 6, 1);
    if (v === 'mountain') pine(V.pine[0], x + 3, sill - 4, 9);
    else for (const [dx, dy] of [[-2, -3], [-1, -5], [0, -7], [1, -5], [2, -3]]) line(V.leaf[0], x + 3, sill - 4, x + 3 + dx * 1.5, sill - 4 + dy);
  } else if (v === 'ice') { // a snow globe
    rect(C.wood, x, sill - 2, 8, 2);
    blob(C.blue, x + 4, sill - 9, [4, 6, 8, 8, 8, 6, 6], true);
    rect(C.white, x + 3, sill - 5, 3, 3); rect(C.amber, x + 4, sill - 4, 1, 1);
    for (let i = 0; i < 4; i++) px(C.white, x + 1 + ((i * 3 + Math.floor(now * 2)) % 7), sill - 9 + ((i * 5 + Math.floor(now * 3)) % 5));
  } else if (v === 'shore') { // a seashell
    blob(C.white, x + 4, sill - 4, [3, 5, 7, 7]);
    for (let i = 0; i < 3; i++) rect(C.amber, x + 2 + i * 2, sill - 3, 1, 3);
    px(C.amber, x + 4, sill - 4);
  } else if (v === 'village') { // flowers in a pot
    rect(C.oak, x, sill - 4, 7, 4);
    rect(C.wood, x, sill - 4, 7, 1);
    for (const [dx, h, c] of [[1, 6, C.amber], [3, 8, C.white], [5, 5, C.amber]]) { rect(V.leaf[0], x + dx, sill - 4 - h, 1, h); px(c, x + dx, sill - 5 - h); }
  }
}

// Bigger touches in the room: on the wall between the window and the clock, the corners, the rug
function drawTouches(t, sk) {
  const v = currentView(), night = !sk.day;
  if (v === 'mountain') {
    for (const [x, c] of [[118, C.amber], [123, C.blue]]) { // skis and poles against the wall
      rect(c, x, 34, 3, 80); rect(C.white, x, 34, 3, 2); px(c, x + 1, 33);
      rect(C.night, x, 70, 3, 1);
    }
    line(C.white, 129, 38, 131, 114); line(C.white, 133, 40, 132, 114);
    rect(C.night, 128, 50, 3, 1); rect(C.night, 131, 52, 3, 1);
    // a lantern hanging by the window
    rect(C.navy, 9, 0, 1, 40);
    rect(C.night, 6, 40, 7, 2); rect(C.night, 6, 49, 7, 1);
    rect(night ? C.amber : C.white, 7, 42, 5, 7);
    rect(C.night, 9, 42, 1, 7);
    if (night) glow(C.amber, 9, 46, 9, 9, 0.25);
  } else if (v === 'ice') {
    // frost creeping in from the corners of the glass
    for (const [cx, cy, sx, sy] of [[22, 20, 1, 1], [109, 20, -1, 1], [22, 89, 1, -1], [109, 89, -1, -1]])
      for (let i = 0; i < 9; i++) for (let j = 0; j < 9 - i; j++)
        if (hash(i * 31 + j * 7 + cx) > (i + j) / 10) px((i + j) % 3 ? C.white : C.blue, cx + sx * i, cy + sy * j);
    // skates hanging on a nail
    px(C.night, 125, 30);
    line(C.white, 125, 30, 120, 42); line(C.white, 125, 30, 130, 40);
    for (const [x, y] of [[118, 42], [128, 40]]) {
      rect(C.white, x, y, 4, 7); rect(C.white, x, y + 5, 7, 3); rect(C.blue, x, y + 2, 4, 1);
      rect(C.blue, x - 1, y + 9, 9, 1); px(C.blue, x - 1, y + 8); px(C.blue, x + 2, y + 8); px(C.blue, x + 5, y + 8);
    }
  } else if (v === 'shore') {
    // a life ring on the wall
    for (let dy = -8; dy <= 8; dy++) for (let dx = -8; dx <= 8; dx++) {
      const d = Math.hypot(dx, dy);
      if (d <= 8 && d >= 4.5) px(Math.floor((Math.atan2(dy, dx) + Math.PI) * 2 / Math.PI) % 2 ? C.white : C.amber, 125 + dx, 50 + dy);
    }
    line(C.white, 125, 32, 119, 44); line(C.white, 125, 32, 131, 44); px(C.night, 125, 31);
    // a fishing net in the top corner with a starfish caught in it
    for (let i = 0; i < 6; i++) { line(C.oak, 300 + i * 4, 0, 320, 20 - i * 4); line(C.oak, 300 + i * 4, 0, 300, i * 4); }
    for (let i = 0; i < 5; i++) { const a = i * 2 * Math.PI / 5 - Math.PI / 2; line(C.amber, 309, 9, 309 + Math.cos(a) * 3, 9 + Math.sin(a) * 3, R); }
  } else if (v === 'village') {
    // a wreath of leaves and flowers
    for (let i = 0; i < 20; i++) {
      const a = i * Math.PI / 10;
      px(i % 5 === 0 ? C.amber : i % 5 === 2 ? C.white : V.leaf[0], 125 + Math.round(Math.cos(a) * 7), 48 + Math.round(Math.sin(a) * 7));
      px(V.pine[0], 125 + Math.round(Math.cos(a + 0.15) * 6), 48 + Math.round(Math.sin(a + 0.15) * 6));
    }
    rect(C.amber, 124, 40, 3, 2);
  } else if (v === 'desert') {
    // a wide sun hat on a peg
    rect(C.night, 125, 40, 1, 2);
    blob(C.amber, 125, 42, [6, 8, 8]);
    rect(C.oak, 117, 45, 17, 1); rect(C.amber, 118, 46, 15, 1);
    rect(C.wood, 121, 44, 9, 1);
  } else if (v === 'forest') {
    // ivy trailing from the window frame and the shelf
    for (const [x0, y0, len] of [[24, 17, 18], [40, 17, 10], [104, 17, 14], [230, 65, 12], [262, 65, 20], [290, 65, 9]])
      for (let k = 0; k < len; k++) {
        const x = x0 + Math.round(Math.sin(k * 0.6 + x0) * 1.5);
        px(V.pine[0], x, y0 + k);
        if (k % 3 === 1) px(V.leaf[0], x + (k % 2 ? 1 : -1), y0 + k);
      }
  }
}

// The rug changes with the view: woven at the village, a kilim in the desert, a towel at the shore
function drawRug() {
  const v = currentView();
  if (v === 'village' || v === 'desert') {
    rect(C.oak, 112, 157, 120, 16);
    for (let y = 158; y < 172; y++)

// ---------- The plant by the window: it grows with finished turns, passing tests, commits and pushes ----------

const PLANT = { x: 30, pot: 152 };

// How the plant looks from its points: size from the last 30 days, flowers on a big day, droops when left alone
function plantLook() {
  const p = world.plant || { total: 0, today: 0, idle: null };
  return {
    stage: Math.min(10, Math.floor(Math.sqrt(p.total / 10))),
    flowers: Math.min(4, Math.floor(p.today / 20)),
    droop: p.idle === null ? 0 : p.idle >= 7 ? 2 : p.idle >= 3 ? 1 : 0
  };
}

function drawPlant(t) {
  const { stage, flowers, droop } = plantLook(), { x, pot } = PLANT;
  const h = 6 + stage * 4;
  const leaf = droop === 2 ? ['#9a7a3c', '#6e5428'] : droop === 1 ? ['#8a9a48', '#5e6e34'] : [V.leaf[0], V.pine[0]];
  const sway = k => Math.sin(t * 0.8) * k / h * 1.5 + (droop ? k * k / h / h * 3 * droop : 0); // leans over when thirsty
  for (let k = 0; k < h; k++) px(V.pine[0], x + Math.round(sway(k)), pot - 1 - k);
  for (let k = 4; k < h; k += 4) { // leaves in pairs up the stem
    const sx = x + Math.round(sway(k)), y = pot - 1 - k, side = (k / 4) % 2 ? 1 : -1, dy = droop ? 1 : 0;
    const big = k > h / 3 && stage > 3 ? 1 : 0, at = (dx, yy, w, c) => rect(c, side > 0 ? sx + dx : sx - dx - w + 1, yy, w, 1);
    at(1, y - 1 + dy, 3 + big, leaf[0]);
    at(1, y + dy, 5 + big, leaf[0]);
    at(2, y + 1 + dy, 3 + big, leaf[1]);
    if (stage > 5) { at(-3, y + 2 + dy, 3, leaf[1]); at(-4, y + 3 + dy, 2, leaf[0]); } // a smaller leaf on the other side
  }
  const tx = x + Math.round(sway(h)), ty = pot - h;
  rect(leaf[0], tx - 1, ty - 1, 3, 1);
  for (let i = 0; i < flowers; i++) { // blossoms on a busy day
    const k = i === 0 ? h : h - 4 - i * 6, fx = x + Math.round(sway(k)) + (i % 2 ? 4 : -4) * (i > 0), fy = pot - k - 2;
    const c = [C.amber, C.white, '#f09aa6', C.amber][i];
    px(c, fx - 1, fy); px(c, fx + 1, fy); px(c, fx, fy - 1); px(c, fx, fy + 1); px(C.amber, fx, fy);
  }
  // the pot
  rect('#b0573c', x - 6, pot, 13, 2);
  rect('#8a4430', x - 5, pot + 2, 11, 6);
  rect('#b0573c', x - 4, pot + 3, 1, 4);
  rect(C.night, x - 5, pot + 8, 11, 1);
}

function showPlant(e) {
  const p = world.plant || { total: 0, today: 0 }, d = world.today;
  card.replaceChildren(el('div', 'name', 'The plant'),
    el('div', 'state', 'Grows with finished turns, passing tests, commits and pushes'),
    el('div', 'step', `Today ${p.today} points` + (d ? ` (${d.done} done, ${d.pass} tests, ${d.commit} commits, ${d.push} pushes)` : '')
      + `  |  30 days ${p.total}` + (p.idle >= 3 ? `  |  thirsty: ${p.idle} days without work` : '')));
  card.style.display = 'block';
  card.style.left = Math.min(e.clientX + 12, innerWidth - 270) + 'px';
  card.style.top = Math.min(e.clientY + 14, innerHeight - 90) + 'px';

}

// ---------- Ambient sound (opt-in in the settings): rain, typing, purring, made on the fly ----------
// Its own audio context, so hiding the page can pause it without silencing the alert chime.

const sound = { ac: null, rain: null, purr: null, buf: null, next: 0 };

function soundOn() {
  if (!cfg.sound) return null;
  try { sound.ac = sound.ac || new AudioContext(); } catch (e) { return null; }
  if (sound.ac.state === 'suspended' && !document.hidden) sound.ac.resume().catch(() => {});
  return sound.ac;
}

function startBeds(ac) {
  sound.buf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
  const data = sound.buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  const bed = (filter, freq, q) => { // looping noise through a filter, silent until turned up
    const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = sound.buf; src.loop = true;
    f.type = filter; f.frequency.value = freq; f.Q.value = q; g.gain.value = 0;
    src.connect(f).connect(g).connect(ac.destination); src.start();
    return g;
  };
  sound.rain = bed('bandpass', 1400, 0.6);
  const o = ac.createOscillator(), lp = ac.createBiquadFilter(), g = ac.createGain(); // purr: a low pulsing hum
  o.type = 'sawtooth'; o.frequency.value = 26; lp.type = 'lowpass'; lp.frequency.value = 180; g.gain.value = 0;
  o.connect(lp).connect(g).connect(ac.destination); o.start();
  sound.purr = g;
}

// A short burst of filtered noise: a key click, or thunder rolling
function burst(ac, at, freq, type, peak, length) {
  const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  src.buffer = sound.buf; f.type = type; f.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, at);
  g.gain.exponentialRampToValueAtTime(peak, at + Math.min(0.3, length / 8));
  g.gain.exponentialRampToValueAtTime(0.0001, at + length);
  src.connect(f).connect(g).connect(ac.destination);
  src.start(at, Math.random()); src.stop(at + length + 0.05);
}

function thunder() { const ac = sound.ac; if (cfg.sound && ac && sound.buf) burst(ac, ac.currentTime + rand(0.3, 1.2), 110, 'lowpass', 0.3, 2.8); }

function meow() {
  const ac = sound.ac;
  if (!cfg.sound || !ac || ac.state !== 'running') return;
  const o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime;
  o.type = 'triangle';
  o.frequency.setValueAtTime(520, t0); o.frequency.linearRampToValueAtTime(820, t0 + 0.15); o.frequency.linearRampToValueAtTime(430, t0 + 0.5);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.04, t0 + 0.05); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.55);
  o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0 + 0.6);
}

function updateSound(dt) {
  const ac = sound.ac;
  if (!ac) return;
  if (!cfg.sound) { if (ac.state === 'running') ac.suspend(); return; }
  if (ac.state !== 'running') return;
  if (!sound.rain) startBeds(ac);
  const t = ac.currentTime;
  const rain = weather.kind === 'storm' ? 0.12 : weather.kind === 'rain' ? 0.05 + Math.min(0.05, weather.precip * 0.01) : 0;
  sound.rain.gain.setTargetAtTime(rain, t, 0.8);
  sound.purr.gain.setTargetAtTime(shown('cat') && (cat.purr > 0 || cat.action === 'purr') ? 0.07 : 0, t, 0.15);
  const typists = agents.filter(a => a.action === 'work' && a.arrived && a.task && a.task !== 'done').length;
  sound.next -= dt;
  if (typists && sound.next <= 0) { burst(ac, t, 3200, 'highpass', 0.03, 0.03); sound.next = rand(0.07, 0.25) / typists; }
}

document.addEventListener('visibilitychange', () => {
  if (!sound.ac) return;
  if (document.hidden) sound.ac.suspend(); else if (cfg.sound) sound.ac.resume().catch(() => {});
});

const portalSize = () => 1 - (1 - world.portal.open) ** 3;

function drawPortal(t) {
  const k = portalSize();
  if (k <= 0) return;
  const { x, y } = PORTAL, rx = PORTAL.rx * k, ry = PORTAL.ry * k, flare = world.portalFlare > 0;
  for (let dy = -Math.ceil(ry); dy <= ry; dy++)
    for (let dx = -Math.ceil(rx); dx <= rx; dx++) {
      const r = Math.hypot(dx / rx, dy / ry);
      if (r > 1) continue;
      const a = Math.atan2(dy / ry, dx / rx), swirl = Math.sin(a * 3 + r * 9 - t * (flare ? 9 : 4));
      let c;
      if (r > 0.86) c = Math.floor(a * 6 / Math.PI + t * 4) % 4 === 0 ? C.white : C.blue; // rim with chasing lights
      else if (flare && r < 0.35) c = C.white;
      else c = swirl > 0.35 ? C.green : swirl > -0.2 ? C.navy : C.night;
      px(c, x + dx, y + dy);
    }
  const w = Math.round(26 * k);
  rect(C.navy, x - w / 2, 125, w, 3);
  rect(C.blue, x - w / 2, 125, w, 1);
}

// A computer shows what its agent is doing: code being typed, a command running, or DONE
function drawMonitor(m, t) {
  const x = m.x, y = 82, w = 54, h = 38;
  const a = m.agent, state = a && a.action === 'work' && a.arrived && a.task ? a.task : 'idle';
  const [label, tone] = SCREEN[state];

  rect(C.navy, x + 23, y + h, 8, 8);

  rect(C.night, x + 3, y + 3, w - 6, h - 7);

  const test = a && a.info.test;
  px(test === 'fail' ? (Math.floor(t * 3) % 2 ? C.amber : C.navy) : test === 'pass' || state !== 'idle' ? C.green : C.navy, x + w - 4, y + h - 3);

  // title bar: project on the left, state on the right

  text(tone, label, x + w - 4 - label.length * 4 + 1, y + 4);

      text(C.white, name, cx, y + 28);
      text(C.green, plus, cx + 22, y + 28);
      text(C.amber, minus, cx + 24 + plus.length * 4, y + 28);
    }
    if (state === 'fix' && (a.info.streak || 0) >= 3) { // a bug crawling across the screen

function drawCode(a, x, y, t) {
  const code = a.code, total = code.reduce((n, l) => n + lineLength(l), 0);

  for (let i = 0; i < code.length && left > 0; i++) { const n = Math.min(left, lineLength(code[i])); shown.push([i, n]); left -= n; }
  const rows = 5, start = Math.max(0, shown.length - rows);
  shown.slice(start).forEach(([i, n], r) => {
    const yy = y + r * 3;
    rect(C.navy, x, yy, 2, 1); // line number gutter
    for (const s of code[i]) {
      const w = Math.min(s.w, n - s.x);
      if (w > 0) rect(a.task === 'fix' && s.c === C.white ? C.amber : s.c, x + 4 + s.x, yy, Math.ceil(w), 1);
    }
  });
  const last = shown.length - start - 1, end = shown.length ? shown[shown.length - 1][1] : 0;
  if (Math.floor(t * 3) % 2) rect(C.green, x + 4 + end, y + Math.max(0, last) * 3 - 1, 1, 3);
}

// Glass tank in fine pixels: shimmering water, sand and pebbles, swaying weed, a castle with a flag,
// an air stone, bubbles, food and three fish
function drawTank(t) {
  const X = TANK.x * R, Y = TANK.y * R, TW = TANK.w * R, TH = TANK.h * R;
  const top = Y + 7, sand = Y + TH - 8; // water surface and sand line, in fine pixels

  // water: lighter near the surface, slow light rays drifting through it
  frect(C.navy, X, top, TW, TH - 7);
  for (let y = top + 1; y < sand; y++)
    for (let x = X + 1; x < X + TW - 1; x++) {
      const k = (y - top) / (sand - top);
      const ray = (x + y * 0.5 + Math.floor(t * 5)) % 23 < 2 && k < 0.75 && (x + y) % 2 === 0;
      if (ray || (k < 0.15 && (x + y) % 2 === 0) || (k < 0.45 && (x + 2 * y) % 7 === 0)) frect(C.blue, x, y);
    }
  // rippling surface with glints
  for (let x = X + 1; x < X + TW - 1; x++) {
    const y = top + Math.round(Math.sin(t * 3 + x * 0.35) * 0.8);
    frect((x * 7 + Math.floor(t * 5)) % 19 === 0 ? C.white : C.blue, x, y);
  }

  // sand with speckles and pebbles
  const r = rng(11);
  frect(C.oak, X + 1, sand, TW - 2, 7);
  for (let i = 0; i < 46; i++) {
    const v = r(), sx = X + 1 + Math.floor(r() * (TW - 2)), sy = sand + Math.floor(r() * 7);
    frect(v < 0.5 ? C.wood : v < 0.8 ? C.amber : C.white, sx, sy);
  }
  frect(C.blue, X + 47, sand - 2, 6, 3); frect(C.navy, X + 48, sand - 1, 4, 2); frect(C.white, X + 48, sand - 2, 2, 1);
  frect(C.white, X + 9, sand - 1, 3, 1); frect(C.blue, X + 8, sand - 2, 5, 1); // air stone

  // weed: each stalk sways more toward its tip, with little leaves
  [[5, 22], [12, 14], [18, 26], [54, 18], [59, 24]].forEach(([bx, len], i) => {
    for (let k = 0; k < len; k++) {
      const x = X + bx + Math.sin(t * 1.4 + i * 1.7 + k * 0.22) * k * 0.13, y = sand - k;
      frect(C.green, x, y);
      if (k > 3 && k % 4 === 0) frect(C.green, x + (k % 8 ? 1 : -1), y - 1);
    }
  });

  // castle: towers with battlements, an arched door, windows and a waving flag
  const cx = X + 27, cb = sand;
  frect(C.white, cx, cb - 10, 12, 10);
  frect(C.white, cx - 3, cb - 15, 4, 15);
  frect(C.white, cx + 11, cb - 15, 4, 15);
  for (let k = 0; k < 4; k += 2) { frect(C.white, cx - 3 + k, cb - 16); frect(C.white, cx + 11 + k, cb - 16); }
  for (let k = 0; k < 12; k += 3) frect(C.white, cx + k, cb - 11, 2, 1);
  frect(C.blue, cx + 14, cb - 15, 1, 15);
  frect(C.blue, cx, cb - 1, 12, 1);
  frect(C.navy, cx + 4, cb - 6, 4, 6); frect(C.navy, cx + 5, cb - 7, 2, 1);
  frect(C.navy, cx - 2, cb - 12, 2, 2); frect(C.navy, cx + 12, cb - 12, 2, 2);
  frect(C.oak, cx + 12, cb - 21, 1, 5);
  const flap = Math.floor(t * 4) % 2;
  frect(C.amber, cx + 13, cb - 21 + flap, 3, 1); frect(C.amber, cx + 13, cb - 20, 4 - flap, 1);

  // bubbles, food and fish
  for (const b of bubbles) {
    const bx = Math.round(b.x * R), by = Math.round(b.y * R);
    if (b.big) { frect(C.white, bx, by - 1); frect(C.white, bx - 1, by); frect(C.white, bx + 1, by); frect(C.blue, bx, by + 1); }
    else frect(C.white, bx, by);
  }
  for (const f of flakes) dot(C.amber, f.x, f.y);
  for (const f of fishes) drawFish(f, t);

  // glass, lid with its light, and the stand
  frect(C.blue, X, Y + 5, 1, TH - 5);
  frect(C.blue, X + TW - 1, Y + 5, 1, TH - 5);
  frect(C.white, X + 2, Y + 9, 1, 10);
  for (let k = 0; k < 6; k++) { frect(C.white, X + 5 + k, Y + 17 - k); frect(C.white, X + 9 + k, Y + 17 - k); }
  frect(C.navy, X - 2, Y + 1, TW + 4, 4);
  frect(C.blue, X - 2, Y + 1, TW + 4, 1);
  frect(C.amber, X + 8, Y + 5, TW - 16, 1);
  frect(C.wood, X - 2, Y + TH, TW + 4, 2);
  frect(C.oak, X - 2, Y + TH, TW + 4, 1);
}

// A fish in fine pixels, facing the way it swims, with a wagging forked tail
function drawFish(f, t) {
  const dir = f.vx >= 0 ? 1 : -1, fx = Math.round(f.x * R), fy = Math.round(f.y * R);
  const at = (ox, oy, c) => frect(c, fx + ox * dir, fy + oy);
  for (let ox = -1; ox <= 2; ox++) { at(ox, -1, f.c); at(ox, 2, f.c); }
  for (let ox = -2; ox <= 3; ox++) { at(ox, 0, f.c); at(ox, 1, f.c); }
  const wag = Math.floor(t * 8 + f.y) % 2;
  at(-3, 0, f.mark === C.blue ? C.blue : f.c); at(-3, 1, f.mark === C.blue ? C.blue : f.c);
  at(-4, wag ? -1 : 0, f.c); at(-4, wag ? 2 : 1, f.c);
  at(0, -2, f.mark === C.blue ? C.blue : f.c);
  if (f.c === C.amber) for (let oy = -1; oy <= 2; oy++) at(0, oy, C.white); // clownfish stripe
  if (f.c === C.green) for (let ox = -2; ox <= 2; ox++) at(ox, 0, C.blue);  // tetra line
  at(2, 0, C.night);
}

// ---------- Characters ----------

// The office cat: a calico built from 3D boxes in fine pixels, with pointed ears, whiskers, a nose
// and a tail that curls up when it walks and wraps around it when it sleeps
// Coats for the settings: where each colour goes, by body part, box face and position on it
const COATS = {
  orange: { // orange tabby with a white chin, chest and paws, and a blue collar
    eye: '#9be05a', collar: C.blue, legs: 'orange', paws: 'white', ears: ['orange', 'orange'], tail: ['orange', 'stripe', 'stripe'],
    mark(part, face, u, v) {
      if (part === 'head') {
        if (face === 'front') return v < 0.45 && u > 0.15 && u < 0.85 ? 'white' : 'orange';
        if (face === 'top') return (u * 4 + 0.1) % 1 < 0.28 ? 'stripe' : 'orange'; // the M on its forehead
        return v > 0.4 && (v * 4) % 1 < 0.3 ? 'stripe' : 'orange';
      }
      if (face === 'front') return u > 0.3 && u < 0.7 && v > 0.35 ? 'white' : 'orange'; // bib
      if (face === 'top') return (v * 6) % 1 < 0.33 ? 'stripe' : 'orange';
      return v < 0.2 ? 'white' : v > 0.35 && (u * 6) % 1 < 0.3 ? 'stripe' : 'orange';
    }
  },
  tuxedo: { // black with a white bib, blaze, muzzle and socks, and a red collar
    eye: '#f2c43a', collar: '#d0504a', legs: 'black', paws: 'white', ears: ['black', 'black'], tail: ['black', 'black', 'black'],
    mark(part, face, u, v) {
      if (part === 'head') return face === 'front' && ((v < 0.5 && u > 0.18 && u < 0.82) || (u > 0.42 && u < 0.58)) ? 'white' : 'black';
      if (face === 'front') return u > 0.28 && u < 0.72 && v > 0.2 ? 'white' : 'black';
      return face !== 'top' && v < 0.22 ? 'white' : 'black';
    }
  },
  calico: { // white with ginger and black patches, a split face, and a pink collar
    eye: '#f2c43a', collar: '#e07aa8', legs: 'white', paws: 'white', ears: ['ginger', 'black'], tail: ['ginger', 'ginger', 'black'],
    mark(part, face, u, v) {
      if (part === 'head') {
        if (face === 'front') return v < 0.5 && u > 0.15 && u < 0.85 ? 'white' : u < 0.5 ? 'ginger' : 'black';
        if (face === 'top') return u < 0.5 ? 'ginger' : 'black';
        return face === 'left' ? 'ginger' : 'black';
      }
      if (face === 'front') return 'white';
      const k = { top: 0, left: 1.7, right: 3.1, back: 5.3 }[face];
      const f = Math.sin(u * 3.1 + k) * Math.sin(v * 2.6 + k * 2);
      return f > 0.3 ? 'ginger' : f < -0.35 ? 'black' : 'white';
    }
  }
};
const coat = () => COATS[cfg.cat] || COATS.orange;

function drawCat(t) {
  const c = coat(), o = { x: cat.x, y: cat.base + cat.y }, yaw = cat.yaw;
  const sleeping = cat.action === 'sleep' || (cat.action === 'snuggle' && cat.base === CAT_DESK && !catAir());
  const sitting = !cat.moving && !sleeping;
  const pawing = cat.action === 'portal' && cat.step === 'tap';
  const breathe = sleeping || cat.purr > 0 || cat.action === 'purr' ? (Math.sin(t * 3) + 1) * 0.25 : 0;
  if (cat.y > -3) rect(C.wood, Math.round(cat.x) - 7, cat.base, 14, 1);
  const fur = part => (face, u, v, fx, fy, b) => shade(FUR[c.mark(part, face, u, v)], b, fx, fy);
  const parts = [];

  if (!sleeping) [[-2, -4], [2, -4], [-2, 4], [2, 4]].forEach(([lx, lz], i) => {
    if (sitting && lz < 0) return; // back legs tucked under when sitting
    const lift = cat.moving && (i + Math.floor(t * 10)) % 2 ? 1 : 0;
    const up = pawing && lz > 0 && lx > 0; // the paw reaching out to the portal
    parts.push({ z: depth([lx, 0, lz], yaw), draw: () => {
      const top = toScreen(o, rotY([lx, 3, lz], yaw));
      const foot = toScreen(o, rotY(up ? [lx, 5 + Math.sin(t * 14), lz + 3] : [lx, lift, lz], yaw));
      line(FUR[c.legs].lit, ...top, ...foot, R);
      frect(FUR[c.paws].lit, Math.round(foot[0] * R), Math.round(foot[1] * R), 2, 1);
      if (!up) frect(C.night, Math.round(foot[0] * R), Math.round(foot[1] * R) + 1, 2, 1); // paw shadow
    } });
  });

  const groom = cat.action === 'groom' && Math.floor(t * 3) % 2;
  const [bodyPos, bodySize] = sleeping ? [[0, 0, 0], [8, 4 + breathe, 10]] : sitting ? [[0, 2, -1], [6, 6 + breathe, 7]] : [[0, 2, 0], [6, 5, 12]];
  const headPos = sleeping ? [0, 0, 5] : sitting ? [0, 7 - groom, 3] : [0, 4, 7.5];
  const hy = headPos[1], hz = headPos[2] + 2.5;
  parts.push({ z: 0, draw: () => box(o, yaw, bodyPos, bodySize, FUR.white, fur('body')) });

  parts.push({ z: depth(headPos, yaw) + 1, draw: () => {
    box(o, yaw, headPos, [6, 5, 5], FUR.white, fur('head'));
    [-1.8, 1.8].forEach((ex, i) => catEar(toScreen(o, rotY([ex, hy + 5 + (i && cat.twitch > 0 ? 0.5 : 0), headPos[2] + 0.5], yaw)), ex > 0, FUR[c.ears[i]].lit));
    if (rotY([0, 0, 1], yaw)[2] < 0.3) return; // face turned away
    const blink = sleeping || (t % 4.3) < 0.15;
    for (const ex of [-1.3, 1.3]) {
      const [x, y] = toScreen(o, rotY([ex, hy + 3.2, hz], yaw));
      if (blink) frect(C.night, Math.round(x * R) - 1, Math.round(y * R) + 1, 2, 1);
      else { frect(c.eye, Math.round(x * R), Math.round(y * R), 1, 2); frect(C.night, Math.round(x * R), Math.round(y * R) + 1); }
    }
    const [nx, ny] = toScreen(o, rotY([0, hy + 2.2, hz], yaw));
    frect('#f09aa6', Math.round(nx * R), Math.round(ny * R));
    for (const side of [-1, 1]) { // one whisker a side
      const a = toScreen(o, rotY([side * 1.6, hy + 1.8, hz], yaw)), b = toScreen(o, rotY([side * 3.8, hy + 1.6, hz + 0.5], yaw));
      line('#d8dde8', ...a, ...b);
    }
    if (!sleeping) { // collar with a little bell
      line(c.collar, ...toScreen(o, rotY([-2.4, hy + 0.3, hz], yaw)), ...toScreen(o, rotY([2.4, hy + 0.3, hz], yaw)));
      const [bx, by] = toScreen(o, rotY([0, hy, hz + 0.3], yaw));
      frect(C.amber, Math.round(bx * R), Math.round(by * R) + 1);
    }
  } });

  // tail: three segments, coloured by the coat
  const back = sleeping ? -5 : sitting ? -4.5 : -6, ty = sleeping ? 1.5 : 4.5;
  parts.push({ z: depth([0, 0, back], yaw) - (sleeping ? 0 : 1), draw: () => {
    const swish = Math.sin(t * (cat.action === 'purr' ? 6 : cat.action === 'portal' ? 4 : 2));
    const pts = sleeping
      ? [[0, ty, back], [3, ty, back - 1], [5, ty, 0], [4, ty, 3]]
      : [[0, ty, back], [swish, ty + 2.5, back - 1.5], [swish * 2.5, ty + 5, back - 2], [swish * 3.5 + 1, ty + 6.5, back - 1.5]];
    const sp = pts.map(p => toScreen(o, rotY(p, yaw)));
    for (let i = 1; i < sp.length; i++) line(FUR[c.tail[i - 1]].lit, ...sp[i - 1], ...sp[i], R);
  } });

  parts.sort((p, q) => p.z - q.z).forEach(p => p.draw());
}

// A pointed ear in fine pixels, leaning outward, pink inside
function catEar([x, y], right, color) {
  const fx = Math.round(x * R), fy = Math.round(y * R), s = right ? 1 : -1;
  frect(color, fx - 1, fy - 1, 3, 1);
  frect('#f09aa6', fx, fy - 1);
  frect(color, Math.min(fx, fx + s), fy - 2, 2, 1);
  frect(color, fx + s, fy - 3);
}

// Claude agents: little 3D blocks in their model's colour, with an antenna
function drawAgent(a, t) {
  const s = a.scale, air = a.y < -0.5, yaw = a.yaw;
  const crouch = !air && a.squash > 0;
  const [w, h, d] = (crouch ? [16, 8, 11] : air ? [12, 11, 9] : [14, 10, 10]).map(v => v * s);
  const walking = a.moving && !air;
  const bob = walking && Math.floor(t * 8) % 2 ? 1 : 0;
  const squat = onCall(a) ? 3 : 0; // sits on the floor while on the intercom
  const feet = { x: Math.round(a.x), y: bottomOf(a) + squat }, o = { x: feet.x, y: feet.y - bob };
  const typing = a.action === 'work' && a.arrived && a.task && a.task !== 'done';
  const petting = a.action === 'cat' && a.arrived;

  const ground = a.level === 'floor' ? FLOOR_Y : a.seat ? 131 : 128;
  if (feet.y <= ground + 1) {
    const sw = Math.max(4, Math.round((w + 4) * Math.max(0.4, 1 + a.y / 60)));
    rect(C.wood, Math.round(a.x - sw / 2), ground, sw, 1);
  }

  const parts = [];

  // Legs: four in a 2x2 grid; they swing over the edge when sitting and step when walking
  [[-4, -2], [4, -2], [-4, 2], [4, 2]].forEach(([lx, lz], i) => {
    lx *= s; lz *= s;
    const phase = i === 0 || i === 3 ? 0 : Math.PI;
    let len = 4, dz = 0, lift = 0;
    if (air) len = 3;
    else if (squat) { len = 1; dz = 2; }
    else if (a.seat) { len = 5; dz = Math.sin(t * (a.action === 'sleep' ? 1.5 : 5) + phase) * 2.5; }
    else if (walking) { dz = Math.sin(t * 12 + phase) * 1.5; lift = Math.max(0, Math.sin(t * 12 + phase)); }
    len *= s;
    const top = toScreen(feet, rotY([lx, 0, lz], yaw)), foot = toScreen(feet, rotY([lx, -len + lift, lz + dz], yaw));
    parts.push({ z: depth([lx, 0, lz], yaw) - 10, draw: () => line(rotY([lx, 0, lz], yaw)[0] > 0 ? a.mat.dark : a.mat.lit, ...top, ...foot, R) });
  });

  // Body, antenna and face
  parts.push({ z: 0, draw: () => {
    box(o, yaw, [0, 0, 0], [w, h, d], a.mat, rimLight);
    const [bx, by] = toScreen(o, rotY([0, h, 0], yaw));
    line(C.oak, bx, by, bx, by - 3 * s);
    rect(C.white, bx - 1, by - 3 * s - 2, 2, 2);
    if (rotY([0, 0, 1], yaw)[2] < 0.3 || s < 0.5) return; // facing away: no face to see
    const eye = ex => toScreen(o, rotY([ex, h - 3 * s, d / 2], yaw));
    const sleepy = a.action === 'sleep' || a.napping, blink = (t + a.x) % 4 < 0.12;
    for (const ex of [-(w / 2 - 4 * s), w / 2 - 4 * s]) {
      const [x, y] = eye(ex);
      if (sleepy) rect(C.night, x - 1, y + 1, 2, 1);
      else rect(C.night, x, y + (blink ? 1 : 0), 1, blink ? 1 : 2);
    }
    if (a.happy > 0 || a.action === 'dance') { const [x, y] = eye(0); rect(C.night, x - 1, y + 4 * s, 2, 1); }
  } });

  // Arms: wave, dance, pet the cat, type, stretch
  const beat = Math.floor(t * 4) % 2;
  const near = rotY([1, 0, 0], yaw)[2] > 0 ? 1 : -1;
  for (const side of [-1, 1]) {
    let ay = 3, az = 0;
    if ((a.happy > 0 || petting) && side === near) ay = 8 + (Math.floor(t * 8) % 2);
    if (a.action === 'wait' && side === near) ay = onCall(a) ? 8 : 6 + (Math.floor(t * 3) % 2) * 3;
    if (a.action === 'dance' && (side > 0) === !!beat) ay = 9;
    if (a.action === 'stretch') ay = 10;
    if (a.action === 'mail' && a.arrived && side === near) ay = 6;
    if (a.ship) ay = 9; // both arms up, holding the package
    if (typing) { ay = 4 + ((Math.floor(t * 10) + (side > 0 ? 1 : 0)) % 2) * 2; az = 3; }
    const pos = [side * (w / 2 + s), ay * s, az * s];
    parts.push({ z: depth(pos, yaw), draw: () => box(o, yaw, pos, [2 * s, 3 * s, 3 * s], a.mat) });
  }
  parts.sort((p, q) => p.z - q.z).forEach(p => p.draw());

  // Status bubble: "!" when it needs you, "..." when thinking, "<>" or "$" while waiting for a free computer
  const top = toScreen(o, rotY([0, h, 0], yaw))[1] - 10 * s;
  if (a.ship) { // the pushed commit as a little parcel
    rect(C.oak, feet.x - 3, top + 1, 6, 4);
    rect(C.white, feet.x - 0.5, top + 1, 1, 4);
    rect(C.wood, feet.x - 3, top + 4, 6, 1);
  }
  if (a.napping) text(C.white, 'ZZ', feet.x - 4, top - 2);
  if (a.action === 'chat' && a.arrived && a.mate) { // teammates take turns talking
    const talker = Math.floor(t * 1.5) % 2 ? a : a.mate;
    text(C.white, '..', Math.round(talker.x) - 3, bottomOf(talker) - 22);
  }
  if (onCall(a)) {
    drawHandset(a, o, yaw, w, h, s);
    const word = Math.floor(t / 1.2) % 2 ? 'OK?' : '?';
    rect(C.navy, feet.x - word.length * 2 - 1, top - 3, word.length * 4 + 1, 7);
    text(C.amber, word, feet.x - word.length * 2, top - 2);
  } else if (a.action === 'wait' && Math.floor(t * 2) % 2) text(C.amber, '!', feet.x - 1, top - 2);
  if (a.action === 'think' || a.action === 'busy') {
    const word = a.action === 'busy' ? (a.activity === 'run' ? '$' : '<>') : '.'.repeat(1 + Math.floor(t * 2) % 3);
    text(a.action === 'busy' ? C.amber : C.white, word, feet.x - word.length * 2, top - 2);
  }
}

// The intercom: a little side table with a phone set, a screen and an antenna light.
// It lights up and shows ASK when a session needs your approval or has a question.
function drawComm(t) {
  const x = COMM.x, calling = callQueue().some(a => a.arrived);
  rect(C.wood, x, 156, 26, 2);
  rect(C.oak, x, 156, 26, 1);
  rect(C.wood, x + 2, 158, 2, 10);
  rect(C.wood, x + 22, 158, 2, 10);
  rect(C.wood, x + 2, 166, 22, 1);

  rect(C.navy, x + 3, 147, 20, 9);
  rect(C.blue, x + 3, 147, 20, 1);
  rect(C.night, x + 5, 149, 13, 6);
  if (cfg.alerts) rect(C.amber, x + 4, 147.5, 1, 1); // little light: alerts are on

  for (let k = 0; k < 3; k++) for (let j = 0; j < 2; j++) dot(C.blue, x + 19.5 + j, 149.5 + k * 1.5); // speaker grille

  // handset resting on its cradle unless someone is using it

    rect(C.blue, x + 5, 144.5, 14, 0.5);
    rect(C.navy, x + 4, 145.5, 2, 2);
    rect(C.navy, x + 18, 145.5, 2, 2);
  }
  // antenna with a beacon: slow green when all is well, fast amber when someone is asking
  line(C.blue, x + 21, 147, x + 21, 139);
  const on = calling ? Math.floor(t * 4) % 2 : Math.sin(t * 2) > 0.3;
  if (on) rect(calling ? C.amber : C.green, x + 20.5, 137.5, 1.5, 1.5);
}

// The caller holds the handset to its head; a curly cord runs back to the intercom
function drawHandset(a, o, yaw, w, h, s) {
  const [hx, hy] = toScreen(o, rotY([-(w / 2 + 2 * s), h - 2 * s, 1], yaw));
  const jack = [COMM.x + 4, 154];
  for (let i = 0; i <= 12; i++) {
    const k = i / 12, sag = Math.sin(k * Math.PI) * 4;
    dot(C.navy, jack[0] + (hx - jack[0]) * k + Math.sin(i * 2.3) * 0.5, jack[1] + (hy + 2 - jack[1]) * k + sag);
  }
  rect(C.navy, hx - 1, hy - 1, 2, 5);
  rect(C.blue, hx - 1, hy - 1, 2, 0.5);
}

function drawPops() {
  for (const p of pops) if (p.age < p.life * 0.8 || Math.floor(p.age * 10) % 2) text(p.color, p.str, p.x, p.y);
}


// ---------- Main loop ----------

function update(dt, t) {
  updateSteam(dt);
  updateMeteor(dt, t);
  if (!calm()) updateMoth(dt);
  updatePops(dt);
  updateTank(dt, t);
  if (shown('cat')) updateCat(dt, t);
  updatePortal(dt);
  updateSound(dt);
  for (const a of agents) updateAgent(a, dt, t);
  for (let i = agents.length - 1; i >= 0; i--) if (agents[i].gone) { release(agents[i]); agents.splice(i, 1); }
  updateRope(cable, dt);
  updateDrops(dt);
  updateStorm(dt, t);
  world.piParty = Math.max(0, world.piParty - dt);
  world.portalFlare = Math.max(0, world.portalFlare - dt);
  world.mailFlag = Math.max(0, world.mailFlag - dt);
}

function offsetX() { return Math.floor((W - SCENE_W) / 2); }

function draw(t) {
  const sk = world.sky = sky();
  drawRoom();
  ctx.save();
  ctx.translate(offsetX() * R, 0);
  drawLights(t, sk);
  if (shown('rug')) drawRug();
  drawWindow(t, sk);
  if (shown('clock')) drawClock();
  if (shown('calendar')) drawCalendar();
  if (shown('today')) drawStats();
  drawShelf(t);
  if (shown('touches')) drawTouches(t, sk);
  if (shown('plant')) drawPlant(t);
  drawPortal(t);
  drawDesk();
  if (!calm() && shown('moth') && world.portal.open > 0.5) drawMoth(t);
  monitors.forEach(m => drawMonitor(m, t));
  drawLaptop(t);
  drawKeyboards(t);
  if (shown('tank')) drawTank(t);
  if (shown('cup')) drawCup();
  for (const a of agents) if (a.level === 'desk' && a.scale > 0.05) drawAgent(a, t);
  drawComm(t);
  if (shown('mailbox')) drawMailbox();
  if (shown('cat')) drawCat(t);
  for (const a of agents) if (a.level === 'floor' && a.scale > 0.05) drawAgent(a, t);
  if (shown('plant')) for (const a of agents) if (a.action === 'water' && a.arrived) // drops from a watering can
    for (let i = 0; i < 3; i++) px(C.blue, PLANT.x + 2 + i * 2, PLANT.pot - 22 + ((now * 18 + i * 5) % 20));
  drawPops();
  ctx.restore();
}

let last = 0, acc = 0, now = 0;
function frame(ms) {
  now = ms / 1000;
  acc += Math.min(0.1, now - last);
  last = now;
  while (acc >= STEP) { update(STEP, now); acc -= STEP; }
  if (!calm() || ++world.frames % 2) draw(now); // calm mode draws at half the frame rate
  requestAnimationFrame(frame);
}

// ---------- Input: tap things in the room, hover a Claude for its card ----------

function scenePoint(e) {
  const r = canvas.getBoundingClientRect();
  return [(e.clientX - r.left) * W / r.width - offsetX(), (e.clientY - r.top) * H / r.height];
}

function agentAt(x, y) {
  return agents.find(a => a.scale > 0.05 && Math.abs(x - a.x) < 10 && y > bottomOf(a) - 18 && y < bottomOf(a) + 6);
}

function showCard(a, e) {
  const c = a.info;
  card.replaceChildren(
    el('div', 'name', (c.name || 'Claude') + (c.project ? ' . ' + c.project : '')),
    el('div', 'state', c.word || c.state || ''));
  if (c.step || c.desc) card.append(el('div', 'step', c.step || c.desc));
  const done = (c.todos || []).filter(i => i.status === 'completed').length;
  const facts = [c.turn && 'Turn ' + c.turn, c.steps && c.steps + ' steps', c.context && 'Context ' + c.context,
    c.todos && c.todos.length && 'Tasks ' + done + '/' + c.todos.length, c.test && 'Tests ' + (c.test === 'pass' ? 'passing' : 'failing'),
    c.commits && c.commits + ' commits', c.pushes && c.pushes + ' pushed'].filter(Boolean);
  if (facts.length) card.append(el('div', 'step', facts.join('  |  ')));
  card.style.display = 'block';
  card.style.left = Math.min(e.clientX + 12, innerWidth - 270) + 'px';
  card.style.top = Math.min(e.clientY + 14, innerHeight - 90) + 'px';
}

canvas.addEventListener('pointermove', e => {
  const a = agentAt(...scenePoint(e));
  if (a) showCard(a, e); else card.style.display = 'none';
});
canvas.addEventListener('pointerleave', () => { card.style.display = 'none'; });

canvas.addEventListener('pointerdown', e => {
  const [x, y] = scenePoint(e);
  const hit = (x0, y0, x1, y1) => x >= x0 && x <= x1 && y >= y0 && y <= y1;
  world.tapped = true;
  soundOn();
  const a = agentAt(x, y);
  if (a) {
    showCard(a, e);
    setTimeout(() => { card.style.display = 'none'; }, 3000);
    pop('&', a.x - 1, bottomOf(a) - 18, C.amber);
    a.happy = 1.5;
    a.spin = 2 * Math.PI;
    if (FREE_ACTIONS.includes(a.action)) startAction(a, pick(['hop', 'dance', 'stretch']));
  }
  else if (hit(COMM.x, 136, COMM.x + 26, 168)) { // shows who is asking
    const caller = callQueue()[0];
    if (caller) showCard(caller, e);
  }
  else if (shown('cat') && Math.abs(x - cat.x) < 9 && y > cat.base - 16 && y < cat.base + 3) { if (cat.action === 'sleep') pop('!', cat.x - 1, cat.base - 22, C.amber); petCat(); }
  else if (shown('tank') && hit(TANK.x - 1, TANK.y, TANK.x + TANK.w, TANK.y + TANK.h)) { feedFish(); tapTank(x); }
  else if (shown('plant') && hit(PLANT.x - 7, PLANT.pot - 6 - plantLook().stage * 4, PLANT.x + 7, PLANT.pot + 9)) showPlant(e);
  else if (hit(PORTAL.x - PORTAL.rx, PORTAL.y - PORTAL.ry, PORTAL.x + PORTAL.rx, PORTAL.y + PORTAL.ry)) {
    if (world.portal.open > 0) world.portalFlare = 1; else world.portal.peek = 9; // asks the cat to open it
  }
  else if (shown('clock') && hit(138, 26, 188, 56)) { cfg.clock24 = !cfg.clock24; saveSettings(); }
  else if (shown('cup') && hit(CUP_X - 2, 110, CUP_X + 13, 128)) puffSteam(25, 12);
  else if (hit(278, 52, 300, 62)) { world.piParty = 0.6; openSettings(); } // the Pi runs the room: its settings
  else if (hit(19, 17, 113, 93)) launchMeteor(now);
});

// Fit the panel: widen the room up to 21:9; in tall panels the session list fills the space below
function resize() {
  W = Math.round(Math.min(Math.max(H * innerWidth / innerHeight, SCENE_W), 420));
  canvas.width = W * R;
  canvas.height = H * R;
  const edge = cfg.shift ? 6 : 0; // room for the pixel shift, so the room's edges never leave the screen
  const s = Math.min((innerWidth - edge) / W, (innerHeight - edge) / H);
  canvas.style.width = Math.floor(W * s) + 'px';
  canvas.style.height = Math.floor(H * s) + 'px';
  // full screen (F, F11 or the desktop shortcut) shows only the room, centred
  const full = !!document.fullscreenElement || (innerWidth >= screen.width && innerHeight >= screen.height);
  const spare = full ? 0 : innerHeight - Math.floor(H * s);
  listEl.style.display = spare > 80 ? 'block' : 'none';
  listEl.style.height = spare + 'px';
  document.body.style.justifyContent = spare > 80 ? 'flex-start' : 'center';
  pixelShift();
}

addEventListener('resize', resize);
canvas.addEventListener('dblclick', toggleFull);
setInterval(pixelShift, 10e3);
resize();
bindSettings();
loadSettings();
setInterval(fetchWeather, 10 * 60e3);
poll();
requestAnimationFrame(frame);
</script>
