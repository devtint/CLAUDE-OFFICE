<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claude Office</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1026; color: #f1ead8; overflow: hidden;
    font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  canvas {
    image-rendering: pixelated; image-rendering: crisp-edges; display: block; flex: none;
    cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  #list { width: 100%; box-sizing: border-box; padding: 6px 14px 14px; overflow-y: auto; display: none; }
  .row { display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px solid #1a2347; }
  .dot { flex: none; width: 8px; height: 8px; margin-top: 5px; }
  .name { color: #f2a33a; }
  .state { color: #6fa8dc; }
  .step { color: #f1ead8; opacity: 0.75; word-break: break-word; }
  .empty { color: #6fa8dc; padding: 10px 0; }
  #dim { position: fixed; inset: 0; z-index: 1; background: #000; opacity: 0; pointer-events: none; }
  #card { position: fixed; display: none; max-width: 260px; z-index: 2; pointer-events: none;
    background: #1a2347; border: 1px solid #6fa8dc; padding: 7px 9px; }
  #card div { word-break: break-word; }
  #settings { position: fixed; inset: 0; z-index: 3; display: none; align-items: center; justify-content: center;
    background: rgba(11, 16, 38, 0.72); }
  #settings.open { display: flex; }
  #settings .box { width: min(330px, calc(100% - 32px)); max-height: calc(100% - 32px); overflow-y: auto; box-sizing: border-box;
    background: #0b1026; border: 2px solid #6fa8dc; box-shadow: 4px 4px 0 #1a2347; padding: 10px 12px 12px; }
  #settings .head { display: flex; justify-content: space-between; align-items: center; color: #f2a33a; letter-spacing: 1px; }
  #settings h3 { margin: 12px 0 5px; font-size: 11px; color: #3ef07a; letter-spacing: 1px; font-weight: normal; }
  #settings label { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 5px 0; }
  #settings label.check { justify-content: flex-start; }
  #settings .grid { display: grid; grid-template-columns: 1fr 1fr; column-gap: 8px; }
  #settings input, #settings select, #settings button { font: inherit; color: #f1ead8; background: #1a2347;
    border: 1px solid #6fa8dc; border-radius: 0; padding: 3px 5px; }
  #settings select, #settings input[type=text] { width: 160px; box-sizing: border-box; }
  #settings input[type=checkbox] { accent-color: #f2a33a; margin: 0; }
  #settings button { color: #f2a33a; cursor: pointer; }
  #settings .city { display: flex; gap: 4px; width: 160px; }
  #settings .city input { width: 0; flex: 1; }
  #settings #sResults button { display: block; width: 100%; text-align: left; margin-top: 3px; color: #f1ead8; }
  #settings .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
  #settings .note { color: #6fa8dc; font-size: 11px; }
  #settings .update { display: none; margin-top: 10px; padding: 7px 8px; border: 1px solid #f2a33a; color: #f2a33a; }
  #settings .update.on { display: block; }
  #settings input[type=range] { width: 160px; padding: 0; accent-color: #f2a33a; }
  #settings .update div { color: #f1ead8; margin: 4px 0; word-break: break-word; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="list"></div>

<div id="settings">

    <div class="head"><span>SETTINGS</span><button id="sClose" aria-label="Close">X</button></div>
    <div id="sUpdate" class="update"></div>
    <h3>CLOCK</h3>

    <div id="sResults"></div>
    <label>Units <select id="sUnits"><option value="C">Celsius</option><option value="F">Fahrenheit</option></select></label>

      <option value="ice">Ice Mountain</option><option value="shore">Shores</option><option value="village">Village</option>
      <option value="desert">Desert</option><option value="forest">Forest</option><option value="random">Random each day</option></select></label>
    <h3>SHOW IN THE ROOM</h3>

    <label>Cat <select id="sCat"><option value="orange">Orange tabby</option><option value="tuxedo">Tuxedo</option><option value="calico">Calico</option></select></label>
    <label class="check"><input type="checkbox" id="sHelpers"> Show subagents</label>
    <label class="check"><input type="checkbox" id="sUpdates"> Check for updates once a day</label>
    <label class="check"><input type="checkbox" id="sSound"> Ambient sound (rain, typing, purring)</label>
    <label class="check"><input type="checkbox" id="sCalm"> Calm mode (fewer animations)<span class="note" id="sCalmWhy"></span></label>
    <div class="foot"><span class="note" id="sNote"></span><button id="sReset">RESET</button></div>
  </div>
</div>
<script>
// Claude Office: one pixel room shared by every active Claude Code session.
// Each session is a Claude agent. It comes in through the portal, takes one of the two computers to
// write code (CODE), run commands (RUN) or fix errors (FIX), reads at the bookshelf, browses on the
// laptop, waits with "!" when it needs you, and spends free time with the cat, the fish tank, the tea
// and the window. When the session ends it leaves through the portal.
// The page polls /state (see claude-office.py). Everything else runs here, so it costs no tokens.
// URL options: ?demo (made-up sessions), ?hour=21 and ?weather=rain (preview the sky), ?noweather, ?view=shore.
// Settings (time zone, weather city, units, view, alerts, room): tap the Raspberry Pi on the shelf.

// Internal resolution: the room is laid out on 320x180 and widens to match wide screens.
// The canvas has R fine pixels per room pixel, so detailed things (the 3D agents and cat, the fish
// tank, thin lines) can use half-pixel detail while the rest keeps its chunky look.
const SCENE_W = 320, H = 180, R = 2;
let W = SCENE_W;
const C = {
  night: '#0b1026', // deep navy (wall, screens)
  navy:  '#1a2347', // navy (sky, bezels)
  wood:  '#3d2618', // dark wood brown
  oak:   '#6b4429', // lighter wood
  amber: '#f2a33a', // warm amber
  green: '#3ef07a', // terminal green
  blue:  '#6fa8dc', // soft blue
  white: '#f1ead8'  // off white
};

const GRAVITY = 300; // pixels per second squared
const STEP = 1 / 60; // fixed physics step
const params = new URLSearchParams(location.search);

const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
const listEl = document.getElementById('list');
const card = document.getElementById('card');
const rand = (a, b) => a + Math.random() * (b - a);
const pick = list => list[Math.floor(Math.random() * list.length)];

// ---------- Drawing helpers ----------

// Room pixels (each one is R x R fine pixels)
function rect(color, x, y, w, h) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.round(x * R), Math.round(y * R), Math.round(w * R), Math.round(h * R));
}

function px(color, x, y) { rect(color, x, y, 1, 1); }

// Fine pixels: one canvas pixel at a room position, or a rectangle in fine-pixel units
function dot(color, x, y) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.round(x * R), Math.round(y * R), 1, 1);
}

function frect(color, fx, fy, fw = 1, fh = 1) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.round(fx), Math.round(fy), fw, fh);
}

// Lines are drawn in fine pixels; width is in fine pixels too
function line(color, x0, y0, x1, y1, width = 1) {
  const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 0.5) * R;
  ctx.fillStyle = color;
  for (let i = 0; i <= n; i++)
    ctx.fillRect(Math.round((x0 + (x1 - x0) * i / n) * R), Math.round((y0 + (y1 - y0) * i / n) * R), width, width);
}

// Rows of centered widths, handy for rounded shapes like clouds
function blob(color, cx, y, widths, dither = false) {
  widths.forEach((w, i) => {
    const x0 = Math.round(cx) - Math.floor(w / 2), yy = Math.round(y) + i;
    if (!dither) return rect(color, x0, yy, w, 1);
    for (let x = x0; x < x0 + w; x++) if ((x + yy) % 2 === 0) px(color, x, yy);
  });
}

// Dithered light: dense checkerboard in the middle, sparse grid at the edge
function glow(color, cx, cy, rx, ry, core = 0.3) {
  for (let y = cy - ry; y <= cy + ry; y++)
    for (let x = cx - rx; x <= cx + rx; x++) {
      const d = ((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2;
      if ((d < core && (x + y) % 2 === 0) || (d < 1 && x % 2 === 0 && y % 2 === 0)) px(color, x, y);
    }
}

function rng(seed) {
  return () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
}

function hash(n) {
  const s = Math.sin(n * 127.1) * 43758.5453;
  return s - Math.floor(s);
}

function hashText(str) {
  let h = 7;
  for (const ch of String(str)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return h;
}

// 3x5 pixel font, each glyph is five rows of three bits ('&' heart, '%' note, '*' check mark)
const FONT = {
  0: '111101101101111', 1: '010110010010111', 2: '111001111100111', 3: '111001111001111',
  4: '101101111001001', 5: '111100111001111', 6: '111100111101111', 7: '111001010010010',
  8: '111101111101111', 9: '111101111001111',
  A: '010101111101101', B: '110101110101110', C: '011100100100011', D: '110101101101110',
  E: '111100110100111', F: '111100110100100', G: '011100101101011', H: '101101111101101',
  I: '111010010010111', J: '001001001101010', K: '101101110101101', L: '100100100100111',
  M: '101111111101101', N: '110101101101101', O: '010101101101010', P: '110101110100100',
  Q: '010101101110011', R: '110101110101101', S: '011100010001110', T: '111010010010010',
  U: '101101101101111', V: '101101101101010', W: '101101111111101', X: '101101010101101',
  Y: '101101010010010', Z: '111001010100111',
  ':': '000010000010000', '+': '000010111010000', '-': '000000111000000', '.': '000000000000010',
  '!': '010010010000010', '?': '111001010000010', '/': '001001010100100', '<': '001010100010001',
  '>': '100010001010100', '$': '011110010011110', '_': '000000000000111', '=': '000111000111000',
  '&': '000101111111010', '%': '011010010110110', '*': '000001101010000'
};

function text(color, str, x, y, scale = 1) {
  for (const ch of String(str)) {
    const g = FONT[ch];
    if (g) for (let i = 0; i < 15; i++)
      if (g[i] === '1') rect(color, x + (i % 3) * scale, y + Math.floor(i / 3) * scale, scale, scale);
    x += 4 * scale;
  }
}

// Text the pixel font can draw: upper case, known glyphs only
const pixelText = (str, max) => [...String(str || '').toUpperCase()].map(ch => FONT[ch] ? ch : ' ').join('').trim().slice(0, max);

// A short screen label: the last words of a project name that fit ('Home Tint Pixel Room' -> 'ROOM')
function shortName(str, max) {
  const words = pixelText(str, 99).split(/\s+/).filter(Boolean);
  let out = '';
  for (let i = words.length - 1; i >= 0; i--) {
    const next = out ? words[i] + ' ' + out : words[i];
    if (next.length > max) break;
    out = next;
  }
  return out || (words.pop() || '').slice(0, max);
}

// ---------- Tiny 3D: shaded boxes projected straight to pixels ----------

const TILT = 0.4; // the camera looks a little down, so top faces show
const LIGHT = [-0.3, 0.8, 0.5].map(v => v / Math.hypot(0.3, 0.8, 0.5));
// Cat fur: sparse shading, not a checkerboard
const FUR = {
  white:  { spark: C.white, lit: C.white, dark: '#aeb9cf', soft: true },
  orange: { spark: '#f7b866', lit: '#e8913a', dark: '#b0612a', soft: true },
  stripe: { spark: '#c46c2e', lit: '#b25d26', dark: '#7c3c18', soft: true },
  black:  { spark: '#62627c', lit: '#30303f', dark: '#1b1b25', soft: true },
  ginger: { spark: '#f4ac62', lit: '#e08a3c', dark: '#a85c28', soft: true }
};

const angleDiff = (a, b) => ((a - b + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;

function rotY([x, y, z], yaw) {
  const c = Math.cos(yaw), s = Math.sin(yaw);
  return [x * c + z * s, y, -x * s + z * c];
}

// Model space (y up, z toward the viewer) to screen pixels around origin o
function toScreen(o, [x, y, z]) { return [o.x + x, o.y - y + z * TILT]; }

// How much a model-space point faces the camera, for depth sorting parts
const depth = (p, yaw) => rotY(p, yaw)[2];

// Brightness tiers stay inside the palette: sparkle, lit, dithered, dark
function shade(mat, b, x, y) {
  if (b > 0.75) return (x + 2 * y) % 5 === 0 ? mat.spark : mat.lit;
  if (b > 0.35) return mat.lit;
  if (b > 0.1) return mat.soft ? ((x + 2 * y) % 4 === 0 ? mat.dark : mat.lit) : (x + y) % 2 ? mat.lit : mat.dark;
  return mat.dark;
}

// Scanline fill of a convex polygon (room coordinates) in fine pixels.
// colorAt(x, y, fx, fy) gets the room position of the pixel centre and its fine-pixel index.
function fillPoly(pts, colorAt) {
  const P = pts.map(([x, y]) => [x * R, y * R]), ys = P.map(p => p[1]);
  for (let y = Math.round(Math.min(...ys)); y < Math.round(Math.max(...ys)); y++) {
    const cy = y + 0.5, xs = [];
    P.forEach((a, i) => {
      const b = P[(i + 1) % P.length];
      if ((a[1] <= cy) !== (b[1] <= cy)) xs.push(a[0] + (cy - a[1]) / (b[1] - a[1]) * (b[0] - a[0]));
    });
    if (xs.length < 2) continue;
    for (let x = Math.round(Math.min(...xs)); x < Math.round(Math.max(...xs)); x++)
      frect(colorAt((x + 0.5) / R, cy / R, x, y), x, y);
  }
}

// Where a point lands on a face: u along its first edge, v along its last
function faceUV(q, x, y) {
  const [a, b, , d] = q, e1 = [b[0] - a[0], b[1] - a[1]], e2 = [d[0] - a[0], d[1] - a[1]];
  const det = e1[0] * e2[1] - e1[1] * e2[0], dx = x - a[0], dy = y - a[1];
  return det ? [(dx * e2[1] - dy * e2[0]) / det, (e1[0] * dy - e1[1] * dx) / det] : [0, 0];
}

// A box given by its bottom centre and size, turned by yaw around the model origin.
// paint(face, u, v, x, y, b) may return a colour to texture a face; otherwise it is shaded.
function box(o, yaw, [cx, y0, cz], [w, h, d], mat, paint) {
  const [x0, x1, y1, z0, z1] = [cx - w / 2, cx + w / 2, y0 + h, cz - d / 2, cz + d / 2];
  const faces = [
    ['front', [0, 0, 1],  [[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]]],
    ['back',  [0, 0, -1], [[x1, y0, z0], [x0, y0, z0], [x0, y1, z0], [x1, y1, z0]]],
    ['right', [1, 0, 0],  [[x1, y0, z1], [x1, y0, z0], [x1, y1, z0], [x1, y1, z1]]],
    ['left',  [-1, 0, 0], [[x0, y0, z0], [x0, y0, z1], [x0, y1, z1], [x0, y1, z0]]],
    ['top',   [0, 1, 0],  [[x0, y1, z1], [x1, y1, z1], [x1, y1, z0], [x0, y1, z0]]]
  ];
  for (const [name, normal, quad] of faces) {
    const n = rotY(normal, yaw);
    if (name !== 'top' && n[2] <= 0.02) continue; // facing away from the camera
    const b = n[0] * LIGHT[0] + n[1] * LIGHT[1] + n[2] * LIGHT[2];
    const q = quad.map(p => toScreen(o, rotY(p, yaw)));
    fillPoly(q, (x, y, fx, fy) => (paint && paint(name, ...faceUV(q, x, y), fx, fy, b)) || shade(mat, b, fx, fy));
  }
}

// A bright rim where the top meets the faces toward the camera gives a box its volume
const rimLight = (face, u, v) => face === 'top' && v < 0.22 ? C.white : null;

// ---------- Fake screen content ----------

// Terminal output: each line is a list of colored dashes
function makeLines(seed, count, maxWidth, alertRate) {
  const r = rng(seed);
  const lines = [];
  for (let i = 0; i < count; i++) {
    const alert = r() < alertRate;
    const segs = [{ x: 0, w: 1, c: alert ? C.amber : C.blue }];
    let x = 2;
    const end = 6 + r() * (maxWidth - 6);
    while (x < end) {
      const w = 1 + Math.floor(r() * 5);
      segs.push({ x, w: Math.min(w, maxWidth - x), c: alert ? C.amber : r() < 0.1 ? C.blue : C.green });
      x += w + 1;
    }
    lines.push(segs);
  }
  return lines;
}

// Source code: indented lines of keywords (amber), names (white), strings (green) and punctuation (blue)
function makeCode(seed) {
  const r = rng(seed), lines = [];
  let indent = 0;
  for (let i = 0; i < 40; i++) {
    const segs = [];
    let x = indent * 3;
    if (r() < 0.4) { const w = 2 + Math.floor(r() * 3); segs.push({ x, w, c: C.amber }); x += w + 1; }
    const words = 1 + Math.floor(r() * 3);
    for (let k = 0; k < words && x < 34; k++) {
      const w = Math.min(2 + Math.floor(r() * 5), 38 - x);
      segs.push({ x, w, c: r() < 0.2 ? C.green : C.white });
      x += w;
      if (r() < 0.5) { segs.push({ x, w: 1, c: C.blue }); x += 1; }
      x += 1;
    }
    lines.push(segs);
    if (r() < 0.3 && indent < 3) indent++;
    else if (r() < 0.3 && indent > 0) indent--;
  }
  return lines;
}

const lineLength = segs => segs.length ? segs[segs.length - 1].x + segs[segs.length - 1].w : 0;

// ---------- Room layout ----------

const DESK_STAND = 124, EDGE_SIT = 131, FLOOR_STAND = 164, FLOOR_Y = 168;
const DESK_X = [64, 304], FLOOR_X = [10, 310];
const PORTAL = { x: 287, y: 110, rx: 11, ry: 16 };
const TANK = { x: 62, y: 104, w: 32, h: 24 };
const CUP_X = 104;
const SHELF_SPOT = 226, LAPTOP_SPOT = 270; // stand beside the laptop so TABS stays visible
const MAX_AGENTS = 8;
const COMM = { x: 254, spot: 244 }; // intercom table on the floor by the drawers, and where the caller sits
const MAILBOX_X = 300, MAIL_SPOT = 292, CALENDAR_SPOT = 205;
const MONTHS = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
const DAYS = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
const monitors = [{ x: 116, agent: null }, { x: 174, agent: null }];

const stars = [[30, 27], [41, 33], [52, 25], [63, 36], [72, 28], [36, 44], [98, 52], [58, 47], [104, 30]]
  .map(([x, y], i) => ({ x, y, phase: i * 1.7, speed: 1 + (i % 3) * 0.7 }));
const buildings = [[25, 10, 22], [35, 8, 30], [43, 12, 18], [55, 9, 34], [64, 14, 24], [78, 10, 28], [88, 8, 20], [96, 11, 26]];
const clouds = [
  { speed: 1.6, y: 30, offset: 0, w: [6, 12, 18, 14] }, { speed: 1.1, y: 46, offset: 70, w: [8, 14, 10] },
  { speed: 1.3, y: 23, offset: 40, w: [10, 16, 12] }, { speed: 0.9, y: 38, offset: 100, w: [6, 14, 20, 16] },
  { speed: 1.4, y: 52, offset: 20, w: [8, 12] }, { speed: 1.0, y: 27, offset: 85, w: [12, 20, 16, 8] }
];
const runLines = makeLines(42, 64, 40, 0.15);

const world = { update: null, plant: null, portal: { open: 0, go: false, wait: 0, idle: 0, peek: 0 }, frames: 0, piParty: 0, tapped: false, portalFlare: 0, sessions: 0, ready: true, today: null, mailFlag: 0 };
const steam = [];
const pops = [];
const drops = [];
const storm = { flash: 0, next: 6, bolt: [] };
const meteor = { active: false, next: 5, x: 0, y: 0, vx: 0, vy: 0, age: 0 };
const moth = { x: PORTAL.x, y: PORTAL.y, vx: 0, vy: 0 };
const cable = makeRope(298, 58, 311, 85, 12, 40);

// Settings, the same as DEFAULTS in tracker.py; loaded from /settings (see the Settings panel below)
const DEFAULTS = { tz: 'Asia/Bangkok', label: 'BKK', city: 'Bangkok', lat: 13.75, lon: 100.5, weather: true, units: 'C',
  clock24: true, alerts: false, idle: 10, max: 8, helpers: true, calm: false, view: 'city', cat: 'orange', sound: false, updates: true,
  brightness: 100, shift: true, awake: false, full: false,
  show_plant: true, show_cup: true, show_tank: true, show_cat: true, show_clock: true, show_calendar: true, show_today: true, show_mailbox: true, show_rug: true, show_touches: true, show_moth: true };
const cfg = Object.assign({}, DEFAULTS);
// Things in the room that can be hidden in the settings, each with its own switch (show_plant and so on)
const SHOW = [['plant', 'Plant'], ['cup', 'Tea cup'], ['tank', 'Fish tank'], ['cat', 'Cat'], ['clock', 'Wall clock'],
  ['calendar', 'Calendar'], ['today', 'Today board'], ['mailbox', 'Mailbox'], ['rug', 'Rug'], ['touches', 'View decorations'], ['moth', 'Moth']];
const shown = k => cfg['show_' + k] !== false;
// Calm mode, also on by itself when the computer asks for less motion
const lessMotion = matchMedia('(prefers-reduced-motion: reduce)');
const calm = () => cfg.calm || lessMotion.matches;

function pop(str, x, y, color, life = 1.4) {
  pops.push({ str, x, y, color, age: 0, life });
}

// ---------- Room time (Bangkok unless set otherwise) drives the clock and the sky ----------

const forcedHour = parseFloat(params.get('hour'));
const SUNRISE = 6.2, SUNSET = 18.3, TWILIGHT = 0.7;

const zoneName = () => cfg.tz === 'auto' ? Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC' : cfg.tz;

// How far the zone is ahead of UTC right now, in ms (daylight saving included)
function zoneOffset(tz, ms) {
  try {
    const f = new Intl.DateTimeFormat('en-US', { timeZone: tz, hourCycle: 'h23', year: 'numeric', month: 'numeric',
      day: 'numeric', hour: 'numeric', minute: 'numeric', second: 'numeric' });
    const p = {};
    for (const x of f.formatToParts(ms)) p[x.type] = +x.value;
    return Date.UTC(p.year, p.month - 1, p.day, p.hour % 24, p.minute, p.second) - Math.floor(ms / 1000) * 1000;
  } catch (e) { return 7 * 3600e3; } // unknown zone: Bangkok
}

// A Date whose UTC fields read as the room's wall clock
let zoneCache = { key: '', off: 0 };
function roomNow() {
  const ms = Date.now(), tz = zoneName(), key = tz + Math.floor(ms / 60e3);
  if (zoneCache.key !== key) zoneCache = { key, off: zoneOffset(tz, ms) };
  const d = new Date(ms + zoneCache.off);
  if (!isNaN(forcedHour)) d.setUTCHours(Math.floor(forcedHour), Math.round((forcedHour % 1) * 60));
  return d;
}

// Where the sun or moon sits on its arc (0 = rising, 1 = setting), in window coordinates
function arc(p) {
  return { x: 22 + 8 + p * 72, y: 20 + 56 - Math.sin(p * Math.PI) * 44 };
}

function sky() {
  const d = roomNow(), h = d.getUTCHours() + d.getUTCMinutes() / 60 + d.getUTCSeconds() / 3600;
  const rise = weather.sunrise ?? SUNRISE, set = weather.sunset ?? SUNSET;
  const day = h >= rise && h < set;
  const twilight = Math.min(Math.abs(h - rise), Math.abs(h - set)) < TWILIGHT;
  const p = day ? (h - rise) / (set - rise) : ((h - set + 24) % 24) / (24 - set + rise);
  const lights = twilight ? 0.25 : day ? 0 : h >= 23 || h < 5 ? 0.12 : 0.35; // fewer lit windows late at night
  return { h, day, twilight, body: arc(p), lights };
}

// Real moon phase from a known new moon: 0 new, 0.5 full
function moonPhase() {
  const days = (Date.now() - Date.UTC(2000, 0, 6, 18, 14)) / 864e5;
  return ((days / 29.530588853) % 1 + 1) % 1;
}

function moonLight() { return (1 - Math.cos(moonPhase() * 2 * Math.PI)) / 2; }

// ---------- Weather where the room is (Open-Meteo, every 10 minutes; off in settings or with ?noweather) ----------

const forcedWeather = params.get('weather');
const weather = { kind: forcedWeather || 'clear', temp: null, cloud: 20, wind: 5, precip: 0, sunrise: null, sunset: null };
const WEATHER_LABEL = { clear: 'CLEAR', cloudy: 'CLOUD', overcast: 'GREY', fog: 'FOG', rain: 'RAIN', storm: 'STORM', snow: 'SNOW' };

// WMO weather codes grouped into what the window can show
function weatherKind(code) {
  if (code >= 95) return 'storm';
  if ((code >= 71 && code <= 77) || code === 85 || code === 86) return 'snow';
  if (code >= 51) return 'rain';
  if (code === 45 || code === 48) return 'fog';
  if (code === 3) return 'overcast';
  if (code === 2) return 'cloudy';
  return 'clear';
}

const weatherOn = () => cfg.weather && !params.has('noweather');

async function fetchWeather() {
  if (!weatherOn()) {
    Object.assign(weather, { kind: forcedWeather || 'clear', temp: null, cloud: 20, wind: 5, precip: 0, sunrise: null, sunset: null });
    return;
  }
  try {
    // sunrise and sunset come back in the room's time zone, so the sky lines up with the clock
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${cfg.lat}&longitude=${cfg.lon}`
      + '&current=temperature_2m,weather_code,cloud_cover,wind_speed_10m,precipitation'
      + '&daily=sunrise,sunset&timezone=' + encodeURIComponent(zoneName()) + '&forecast_days=1';
    const d = await (await fetch(url)).json();
    const hours = iso => +iso.slice(11, 13) + iso.slice(14, 16) / 60;
    Object.assign(weather, {
      kind: forcedWeather || weatherKind(d.current.weather_code),
      temp: Math.round(d.current.temperature_2m),
      cloud: d.current.cloud_cover, wind: d.current.wind_speed_10m, precip: d.current.precipitation,
      sunrise: hours(d.daily.sunrise[0]), sunset: hours(d.daily.sunset[0])
    });
  } catch (e) { /* offline: keep the last known weather */ }
}

const wet = () => weather.kind === 'rain' || weather.kind === 'storm' || weather.kind === 'snow';
const dull = () => wet() || weather.kind === 'overcast' || weather.kind === 'fog'; // sun and stars hidden

function cloudCount() {
  if (dull()) return clouds.length;
  if (weather.kind === 'cloudy') return 4;
  return Math.min(2, Math.max(1, Math.round(weather.cloud / 25)));
}

// ---------- Ambient physics ----------

// Verlet rope pinned at both ends: settles into a natural sag under gravity
function makeRope(ax, ay, bx, by, n, length) {
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const x = ax + (bx - ax) * i / n, y = ay + (by - ay) * i / n;
    pts.push({ x, y, px: x, py: y });
  }
  return { pts, seg: length / n };
}

function updateRope(rope, dt) {
  const pts = rope.pts, n = pts.length - 1;
  for (let i = 1; i < n; i++) {
    const p = pts[i], vx = (p.x - p.px) * 0.98, vy = (p.y - p.py) * 0.98;
    p.px = p.x; p.py = p.y;
    p.x += vx; p.y += vy + GRAVITY * dt * dt;
  }
  for (let k = 0; k < 12; k++)
    for (let i = 0; i < n; i++) {
      const a = pts[i], b = pts[i + 1];
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
      const wa = i === 0 ? 0 : 1, wb = i + 1 === n ? 0 : 1;
      const s = (d - rope.seg) / d / (wa + wb);
      a.x += dx * s * wa; a.y += dy * s * wa;
      b.x -= dx * s * wb; b.y -= dy * s * wb;
    }
}

function puffSteam(n, spread) {
  for (let i = 0; i < n; i++)
    steam.push({ x: CUP_X + 4 + rand(-1, 2), y: 116, vx: rand(-spread, spread), vy: rand(-6, -3), age: 0, life: rand(2, 3) });
}

// Steam: warm air rises faster as it goes, drifts with turbulence, then fades
function updateSteam(dt) {
  if (Math.random() < dt * 16) puffSteam(1, 0);
  for (const p of steam) {
    p.vy -= 3 * dt;
    p.vx = (p.vx + rand(-15, 15) * dt) * 0.97;
    p.x += p.vx * dt; p.y += p.vy * dt; p.age += dt;
  }
  for (let i = steam.length - 1; i >= 0; i--) if (steam[i].age > steam[i].life) steam.splice(i, 1);
}

// Shooting star on a slight ballistic arc
function launchMeteor(t) {
  Object.assign(meteor, { active: true, x: rand(60, 105), y: rand(22, 30), vx: -80, vy: 20, age: 0, next: t + rand(8, 18) });
}

function updateMeteor(dt, t) {
  if (!meteor.active && t > meteor.next && !world.sky?.day && !dull() && !calm()) launchMeteor(t);
  if (!meteor.active) return;
  meteor.vy += 40 * dt;
  meteor.x += meteor.vx * dt; meteor.y += meteor.vy * dt; meteor.age += dt;
  if (meteor.age > 0.7) meteor.active = false;
}

// Moth: drawn to the portal's light with random flutter
function updateMoth(dt) {
  moth.vx = (moth.vx + ((PORTAL.x - moth.x) * 6 + rand(-300, 300)) * dt) * 0.96;
  moth.vy = (moth.vy + ((PORTAL.y - 4 - moth.y) * 6 + rand(-300, 300)) * dt) * 0.96;
  moth.x += moth.vx * dt; moth.y += moth.vy * dt;
}

// Rain falls fast and slants with the wind, snow drifts; both stop at the window sill
let dropBudget = 0;
function updateDrops(dt) {
  const snow = weather.kind === 'snow';
  const rate = weather.kind === 'storm' ? 150 : weather.kind === 'rain' ? (weather.precip > 1 ? 110 : 70) : snow ? 14 : 0;
  for (dropBudget += rate * (calm() ? 0.4 : 1) * dt; dropBudget >= 1; dropBudget--)
    drops.push({ x: rand(10, 125), y: 18, vx: snow ? rand(-4, 4) : -weather.wind * 1.5, vy: snow ? rand(8, 14) : rand(110, 150), snow });
  for (const d of drops) {
    if (d.snow) d.vx = (d.vx + rand(-25, 25) * dt) * 0.98;
    d.x += d.vx * dt; d.y += d.vy * dt;
  }
  for (let i = drops.length - 1; i >= 0; i--) if (drops[i].y > 90) drops.splice(i, 1);
}

// Lightning: a jagged bolt, a double flash, and everyone flinches
function updateStorm(dt, t) {
  storm.flash = Math.max(0, storm.flash - dt);
  if (weather.kind !== 'storm' || t < storm.next) return;
  storm.flash = 0.3;
  storm.next = t + rand(5, 14);
  let x = rand(40, 95), y = 20;
  storm.bolt = [[x, y]];
  while (y < 62) { x += rand(-5, 5); y += rand(4, 8); storm.bolt.push([x, y]); }
  for (const a of agents) if (FREE_ACTIONS.includes(a.action)) startAction(a, 'alarm');
  startleCat();
  thunder();
}

function lightning() { return storm.flash > 0.2 || (storm.flash > 0 && storm.flash < 0.1); }

function updatePops(dt) {
  for (const p of pops) { p.y -= 10 * dt; p.age += dt; }
  for (let i = pops.length - 1; i >= 0; i--) if (pops[i].age > pops[i].life) pops.splice(i, 1);
}

// ---------- The fish tank ----------

const tankIn = { x0: TANK.x + 3, x1: TANK.x + TANK.w - 4, y0: TANK.y + 6, y1: TANK.y + TANK.h - 6 };
// a clownfish (amber, white stripe), a white fish with blue fins and a green tetra with a blue line
const fishes = [[C.amber, C.white], [C.white, C.blue], [C.green, C.blue]]
  .map(([c, mark], i) => ({ c, mark, x: TANK.x + 8 + i * 8, y: TANK.y + 9 + i * 3, vx: i % 2 ? -6 : 6, vy: 0, tx: 0, ty: 0, next: 0 }));
const flakes = [];
const bubbles = [];

function feedFish() {
  for (let i = 0; i < 5; i++) flakes.push({ x: rand(tankIn.x0, tankIn.x1), y: TANK.y + 4, vy: 0, age: 0 });
}

function tapTank(x) {
  for (const f of fishes) { f.vx += (f.x < x ? -1 : 1) * 30; f.vy += rand(-12, 12); }
}

// Fish steer toward food or a wandering target, with drag; flakes sink slowly
function updateTank(dt, t) {
  if (Math.random() < dt * 4) bubbles.push({ x: TANK.x + 5 + rand(-0.5, 0.5), y: TANK.y + TANK.h - 5, big: Math.random() < 0.3 });
  for (const b of bubbles) { b.y -= 10 * dt; b.x += Math.sin(t * 6 + b.y) * 0.1; }
  for (let i = bubbles.length - 1; i >= 0; i--) if (bubbles[i].y < TANK.y + 5) bubbles.splice(i, 1);
  for (const f of flakes) { f.vy = Math.min(f.vy + 20 * dt, 4); f.y = Math.min(f.y + f.vy * dt, TANK.y + TANK.h - 4); f.age += dt; }
  for (let i = flakes.length - 1; i >= 0; i--) if (flakes[i].age > 15) flakes.splice(i, 1);
  for (const f of fishes) {
    const food = flakes.reduce((best, k) => !best || Math.hypot(k.x - f.x, k.y - f.y) < Math.hypot(best.x - f.x, best.y - f.y) ? k : best, null);
    if (food) { f.tx = food.x; f.ty = food.y; }
    else if (t > f.next) { f.tx = rand(tankIn.x0, tankIn.x1); f.ty = rand(tankIn.y0, tankIn.y1); f.next = t + rand(2, 5); }
    f.vx = (f.vx + (f.tx - f.x) * 2 * dt) * 0.97;
    f.vy = (f.vy + (f.ty - f.y) * 2 * dt) * 0.95;
    f.x = Math.max(tankIn.x0, Math.min(tankIn.x1, f.x + f.vx * dt));
    f.y = Math.max(tankIn.y0, Math.min(tankIn.y1, f.y + f.vy * dt));
    if (food && Math.hypot(food.x - f.x, food.y - f.y) < 2) flakes.splice(flakes.indexOf(food), 1);
  }
}

// ---------- The cat ----------

const cat = { x: 200, y: 0, vx: 0, vy: 0, base: FLOOR_Y, yaw: 0.7, action: 'sleep', step: '', timer: 8, target: 200, face: 1,
  moving: false, twitch: 0, purr: 0, spot: 0, buddy: null };
const CAT_DESK = 128, CAT_UP = PORTAL.x + 9, CAT_SEAT = PORTAL.x + 15; // the desk top, where it jumps up, where it sits
const catAir = () => cat.y !== 0 || cat.vy !== 0;

function startCat(action, time) {
  cat.action = action;
  cat.timer = time;
  if (action === 'walk') cat.target = rand(20, 300);
}

function petCat() {
  cat.purr = 2;
  if (cat.base !== FLOOR_Y) { if (Math.random() < 0.05) pop('&', cat.x - 1, cat.base - 18, C.amber); return; } // busy up on the desk
  if (cat.action !== 'purr') startCat('purr', 4);
}

function startleCat() {
  if (cat.y < 0 || cat.base !== FLOOR_Y) return;
  cat.vy = -90;
  pop('!', cat.x - 1, cat.base - 22, C.amber);
  startCat('walk', 3);
}

// Jumps between the floor and the desk top, landing at x
function catJump(up, x) {
  cat.base = up ? CAT_DESK : FLOOR_Y;
  cat.y = up ? FLOOR_Y - CAT_DESK : CAT_DESK - FLOOR_Y;
  cat.vy = up ? -160 : -50;
  cat.vx = (x - cat.x) / 0.71; // both jumps take about 0.71 s
  cat.face = Math.sign(x - cat.x) || cat.face;
}

function catRun(x, speed, dt) {
  const dx = x - cat.x;
  if (Math.abs(dx) <= 1) return true;
  cat.face = Math.sign(dx);
  cat.x += cat.face * Math.min(Math.abs(dx), speed * dt);
  cat.moving = true;
  return false;
}

// The portal only opens when someone is coming or going, and the cat is the one who opens it
const portalWanted = () => world.portal.peek > 0 || agents.some(a => a.action === 'spawn' || a.action === 'leave' || a.action === 'ship');

function updatePortal(dt) {
  const P = world.portal, want = portalWanted();
  P.peek = Math.max(0, P.peek - dt);
  if (want) { P.idle = 0; P.wait += dt; if (P.wait > 12 || !shown('cat')) P.go = true; } // in the end it opens without the cat
  else { P.wait = 0; P.idle += dt; if (P.idle > 1.5) P.go = false; }
  P.open = Math.max(0, Math.min(1, P.open + (P.go ? dt * 2 : -dt * 1.5)));
}

// Someone is coming or going: the cat runs over, jumps on the desk and paws the portal open,
// then sits beside it until everyone is through and it has closed again
function catPortal(dt) {
  const P = world.portal;
  switch (cat.step) {
    case 'leap': catJump(false, cat.x); cat.step = 'run'; break; // up on the desk somewhere else: down first
    case 'run':
      if (catRun(CAT_UP, 40, dt)) { cat.step = 'up'; catJump(true, CAT_SEAT); cat.face = -1; }
      break;
    case 'up': cat.step = 'tap'; cat.timer = 0.8; break; // landed on the desk
    case 'tap':
      cat.face = -1;
      if (cat.timer <= 0) { P.go = true; P.idle = -2; world.portalFlare = 1; cat.step = 'guard'; pop('%', cat.x - 2, cat.base - 20, C.green); meow(); }
      break;
    case 'guard':
      cat.face = -1;
      if (portalWanted() && !P.go) { cat.step = 'tap'; cat.timer = 0.6; }
      else if (!portalWanted() && P.open === 0) { cat.step = 'down'; catJump(false, CAT_UP); }
      break;
    default: startCat('sit', rand(2, 4)); // back on the floor
  }
}

// Trips up to the desk: sitting on an idle keyboard, or curling up beside a sleeping Claude
function catTrip(dt) {
  const m = monitors.find(mm => mm.x + 27 === cat.spot);
  const over = cat.action === 'keys' ? !m || !!m.agent
    : !cat.buddy || !agents.includes(cat.buddy) || cat.buddy.action !== 'sleep';
  if (cat.base === FLOOR_Y) {
    if (over) return startCat('sit', rand(2, 4));
    if (catRun(cat.spot - 6, 20, dt)) { catJump(true, cat.spot); cat.timer = cat.action === 'keys' ? rand(10, 18) : rand(15, 30); }
    return;
  }
  if (cat.action === 'snuggle' && Math.random() < dt * 0.4) pop('Z', cat.x + 3, cat.base - 14, C.white, 2.2);
  if (over || cat.timer <= 0) {
    if (over && cat.action === 'keys') pop('!', cat.x - 1, cat.base - 22, C.amber); // someone needs that computer
    catJump(false, cat.spot + 6);
    startCat('sit', rand(2, 4));
  }
}

// What to do next: mostly cat things, sometimes something with the Claudes
function nextCat() {
  const r = Math.random();
  const keys = monitors.filter(m => !m.agent);
  const sleepers = agents.filter(a => a.action === 'sleep' && a.level === 'desk' && a.scale > 0.5);
  const walkers = agents.filter(a => a.level === 'floor' && a.moving);
  if (r < 0.1 && keys.length) { startCat('keys', 30); cat.spot = pick(keys).x + 27; }
  else if (r < 0.2 && sleepers.length) {
    const b = pick(sleepers);
    startCat('snuggle', 30); cat.buddy = b; cat.spot = Math.round(Math.max(68, Math.min(270, b.x + (b.x > 250 ? -11 : 11))));
  }
  else if (r < 0.28 && walkers.length) { startCat('follow', rand(6, 10)); cat.buddy = pick(walkers); }
  else if (r < 0.5) startCat('walk', 8);
  else if (r < 0.63) startCat('sit', rand(4, 7));
  else if (r < 0.83) startCat('sleep', rand(10, 18));
  else if (r < 0.91) startCat('groom', rand(3, 5));
  else if (shown('tank')) startCat('watch', rand(6, 10));
  else startCat('sit', rand(4, 7)); // sits under the fish tank, staring, and paws at it
}

function updateCat(dt, t) {
  if (catAir()) {
    cat.vy += GRAVITY * dt; cat.y += cat.vy * dt; cat.x += cat.vx * dt;
    if (cat.vy > 0 && cat.y >= 0) { cat.y = 0; cat.vy = 0; cat.vx = 0; }
  }
  const air = catAir();
  cat.timer -= dt;
  cat.purr = Math.max(0, cat.purr - dt);
  cat.moving = false;
  cat.twitch = Math.max(0, cat.twitch - dt);
  if (Math.random() < dt * 0.15) cat.twitch = 0.25; // an ear flicks now and then
  if (!air && portalWanted() && cat.action !== 'portal') {
    if (cat.action === 'sleep') pop('!', cat.x - 1, cat.base - 22, C.amber);
    cat.action = 'portal'; cat.timer = 0.6;
    cat.step = cat.base === FLOOR_Y ? 'run' : Math.abs(cat.x - CAT_SEAT) < 2 ? 'tap' : 'leap';
  }
  if (air) { /* mid-jump */ }
  else if (cat.action === 'portal') catPortal(dt);
  else if (cat.action === 'keys' || cat.action === 'snuggle') catTrip(dt);
  else if (cat.base !== FLOOR_Y) catJump(false, cat.x); // anything else happens on the floor
  else {
    if (cat.action === 'follow') { // trails a Claude around the room
      const b = cat.buddy;
      if (!b || !agents.includes(b) || b.level !== 'floor') cat.timer = 0;
      else catRun(b.x - (b.face || 1) * 12, 18, dt);
    }
    const goal = cat.action === 'walk' ? cat.target : cat.action === 'watch' ? TANK.x + 16 : null;
    if (goal !== null && catRun(goal, 12, dt)) {
      if (cat.action === 'walk') cat.timer = Math.min(cat.timer, 0.3);
      else if (Math.random() < dt * 0.3) { cat.vy = -70; tapTank(TANK.x + rand(6, 26)); } // a swipe at the glass
    }
    if (cat.action === 'sleep' && Math.random() < dt * 0.4) pop('Z', cat.x + 3, cat.base - 18, C.white, 2.2);
    if (cat.action === 'purr' && Math.random() < dt * 1.5) pop('&', cat.x + rand(-4, 2), cat.base - 18, C.amber);
    if (cat.timer <= 0) nextCat();
  }
  const target = cat.moving ? cat.face * Math.PI / 2
    : cat.action === 'portal' ? (cat.step === 'tap' ? -Math.PI / 2 : -0.7)
    : cat.action === 'keys' ? 0.3
    : cat.action === 'watch' ? Math.PI : cat.action === 'sleep' || cat.action === 'snuggle' ? cat.face * 0.8 : cat.face * 0.5;
  cat.yaw += angleDiff(target, cat.yaw) * Math.min(1, dt * 6);
}

// ---------- Agents: one Claude per session, with a little state machine and physics ----------

const agents = [];

// Body colour by model, straight from /state: Opus orange, Sonnet blue, Haiku green, Fable purple,
// other models grey. The shaded sides use the same colour, darker.
function modelMat(colour) {
  const lit = /^#[0-9a-f]{6}$/i.test(colour || '') ? colour : '#D97757';
  const n = parseInt(lit.slice(1), 16), ch = k => Math.round(((n >> k) & 255) * 0.62);
  return { spark: lit, lit, dark: `rgb(${ch(16)},${ch(8)},${ch(0)})` };
}

function spawnAgent(info) {
  const a = {
    id: info.id, info, helper: !!info.parent, mat: modelMat(info.colour), code: makeCode(hashText(info.id)),
    x: PORTAL.x, y: 0, vx: 0, vy: 0, level: 'desk', seat: false, squash: 0, scale: 0,
    action: 'spawn', timer: Infinity, target: PORTAL.x, face: -1, hops: 0, happy: 0, yaw: 0, idleYaw: 0, spin: 0,
    activity: '', task: null, taskTime: 0, monitor: null, arrived: false, moving: false, sub: 0, after: null, buddy: null,
    pushes: info.pushes || 0, ship: false, napping: false, mate: null
  };
  agents.push(a);
  return a;
}

const baseOf = a => a.level === 'floor' ? FLOOR_STAND : a.seat ? EDGE_SIT : DESK_STAND;
const bottomOf = a => baseOf(a) + Math.round(a.y);
const grounded = a => a.y === 0 && a.vy === 0;
const fullScale = a => a.helper ? 0.7 : 1;

function jump(a, vy, vx = 0) { a.vy = vy; a.vx = vx; }

// Change what an agent stands on without a visible jump in position
function rebase(a, change) {
  const before = baseOf(a);
  change();
  a.y += before - baseOf(a);
}

function setSeat(a, seat) {
  if (a.seat === seat || a.level !== 'desk') return;
  rebase(a, () => { a.seat = seat; });
  if (!seat) jump(a, -75);
}

// Hop down to the floor in front of the desk, or jump back up onto it
function setLevel(a, level) {
  if (a.level === level) return;
  rebase(a, () => { a.seat = false; a.level = level; });
  jump(a, level === 'desk' ? -175 : -30);
}

function walkTo(a, x, speed, dt) {
  const dx = x - a.x;
  if (Math.abs(dx) <= 1) return grounded(a);
  if (grounded(a)) {
    a.face = Math.sign(dx);
    a.x += a.face * Math.min(speed * dt, Math.abs(dx));
    a.moving = true;
  }
  return false;
}

// ---------- Computers ----------

const freeMonitor = () => monitors.find(m => !m.agent);

function assignWork(a) {
  if (a.monitor) return true;
  const m = freeMonitor();
  if (!m) return false;
  m.agent = a;
  a.monitor = m;
  return true;
}

function release(a) {
  if (a.monitor) a.monitor.agent = null;
  a.monitor = null;
}

// ---------- What each session's state means for its agent ----------

const KIND = tool =>
  /^(Edit|Write|NotebookEdit|MultiEdit)$/.test(tool) ? 'code'
  : /^(Bash|PowerShell)$/.test(tool) ? 'run'
  : /^(Read|Grep|Glob|Skill)$/.test(tool) ? 'read'
  : /^(Agent|Task)$/.test(tool) ? 'summon'
  : /mail|outlook/i.test(tool) ? 'mail'
  : /calendar/i.test(tool) ? 'calendar'
  : /Web|Browser|chrome/.test(tool) ? 'web'
  : 'think';

function activityOf(c) {
  switch (c.state) {
    case 'working':  return c.tool ? KIND(c.tool) : 'think';
    case 'error':    return 'fix';
    case 'thinking': return 'think';
    case 'waiting':  return 'wait';
    case 'done':     return 'done';
    default:         return 'off';
  }
}

const AT_COMPUTER = ['code', 'run', 'fix'];
const FREE_ACTIONS = ['sit', 'walk', 'hop', 'dance', 'look', 'gaze', 'fish', 'cat', 'water', 'tea', 'stretch', 'book', 'highfive', 'chat', 'sleep', 'think'];
const DESK_ONLY = ['sit', 'sleep', 'gaze', 'fish', 'tea', 'book', 'work', 'busy', 'read', 'browse', 'summon', 'calendar', 'ship', 'leave', 'highfive'];

function applyState(a, c) {
  if (c.colour !== a.info.colour) a.mat = modelMat(c.colour); // the model can change mid-session
  a.info = c;
  a.napping = c.compacted != null && c.compacted < 12;       // just compacted: a quick nap
  // a new test result: cheer when it passes, wince when it fails
  if (c.test && c.test_age != null) {
    const stamp = Date.now() / 1000 - c.test_age;
    if (a.testStamp && Math.abs(stamp - a.testStamp) > 2) {
      if (c.test === 'pass') { a.happy = 2; pop('*', a.x - 1, bottomOf(a) - 20, C.green); if (grounded(a)) jump(a, -50); }
      else pop('!', a.x - 1, bottomOf(a) - 20, C.amber);
    }
    a.testStamp = stamp;
  }
  // a push: carry the package to the portal
  if ((c.pushes || 0) > a.pushes) {
    a.ship = true;
    if (!['wait', 'leave', 'spawn', 'climb'].includes(a.action)) startAction(a, 'ship');
  }
  a.pushes = c.pushes || 0;
  const act = activityOf(c);
  if (act === a.activity) return;
  if (act === 'wait') announce(a);
  const wasWorking = a.monitor && AT_COMPUTER.includes(a.activity);
  a.activity = act;
  if (AT_COMPUTER.includes(act)) { a.task = act; a.taskTime = 0; }
  else if (act === 'done' && wasWorking) { a.task = 'done'; a.taskTime = 0; } // DONE on its screen for a moment
  else { a.task = null; release(a); }
  if (a.action !== 'spawn' && a.action !== 'leave') plan(a);
}

// Pick the action that shows what the session is doing; free time when it is done
function plan(a) {
  switch (a.activity) {
    case 'code': case 'run': case 'fix': return startAction(a, assignWork(a) ? 'work' : 'busy');
    case 'done':  return startAction(a, a.monitor ? 'work' : freeMood(a));
    case 'read':  return startAction(a, 'read');
    case 'web':   return startAction(a, 'browse');
    case 'summon': return startAction(a, 'summon');
    case 'mail':  return startAction(a, shown('mailbox') ? 'mail' : 'think');
    case 'calendar': return startAction(a, shown('calendar') ? 'calendar' : 'think');
    case 'wait':  return startAction(a, 'wait');
    case 'off':   return startAction(a, 'sleep');
    default:      return startAction(a, 'think');
  }
}

function freeMood(a) {
  const busyWith = act => agents.some(o => o !== a && o.action === act);
  const moods = ['sit', 'walk', 'hop', 'dance', 'look', 'gaze', 'stretch', 'book'];
  if (shown('tank')) moods.push('fish', 'fish');
  if (shown('cup')) moods.push('tea');
  if (shown('cat') && !busyWith('cat')) moods.push('cat', 'cat');
  if (shown('plant') && !busyWith('water')) moods.push('water', ...(plantLook().droop ? ['water', 'water'] : []));
  if (wet()) moods.push('gaze', 'gaze'); // rain is worth watching
  if (findBuddy(a)) moods.push('highfive');
  if (agents.some(o => o !== a && o.level === a.level && o.info.project === a.info.project && FREE_ACTIONS.includes(o.action)))
    moods.push('chat', 'chat'); // teammates on the same project talk it over
  const h = world.sky ? world.sky.h : 12;
  if (h >= 6 && h < 10 && shown('cup')) moods.push('tea', 'tea');         // morning tea
  if (h >= 23 || h < 5) moods.push('sleep', 'stretch');   // late night: yawning and dozing
  return pick(moods);
}

const findBuddy = a => agents.find(o => o !== a && o.activity === 'done' && o.level === 'desk' && FREE_ACTIONS.includes(o.action) && !o.buddy);

// A spot near x that no other agent on the same level is heading for, so two never stand in one place
function freeSpot(a, x) {
  const [lo, hi] = a.level === 'floor' ? FLOOR_X : DESK_X;
  for (const d of [0, 14, -14, 28, -28, 42, -42]) {
    const c = Math.max(lo, Math.min(hi, x + d));
    if (!agents.some(o => o !== a && o.level === a.level && o.target !== undefined && o.timer === Infinity
        && o.action !== 'work' && Math.abs(o.target - c) < 13)) return c;
  }
  return x;
}

function startAction(a, name) {
  if (DESK_ONLY.includes(name) && a.level === 'floor') {
    setLevel(a, 'desk');
    a.action = 'climb'; a.after = name; a.timer = 3; a.arrived = false;
    return;
  }
  if (a.buddy && name !== 'highfive' && name !== 'buddy') { a.buddy.buddy = null; a.buddy = null; }
  a.action = name; a.sub = 0; a.arrived = false;
  if (name !== 'sit' && name !== 'sleep' && a.seat) setSeat(a, false);
  const [lo, hi] = a.level === 'floor' ? FLOOR_X : DESK_X;
  switch (name) {
    case 'sit':     setSeat(a, true); a.timer = rand(4, 8); a.idleYaw = pick([0, 0.5, -0.5, 0.9]); break;
    case 'sleep':   setSeat(a, true); a.timer = rand(8, 14); break;
    case 'walk':    a.target = rand(lo, hi); a.timer = 9; break;
    case 'hop':     a.hops = 1 + Math.floor(rand(0, 3)); a.timer = 3; break;
    case 'dance':   a.timer = rand(4, 6); break;
    case 'look':    a.timer = 3; break;
    case 'stretch': a.timer = 2.5; break;
    case 'gaze':    a.target = rand(66, 108); a.timer = rand(7, 10); break;
    case 'fish':    a.target = TANK.x + TANK.w / 2 + rand(-5, 5); a.timer = rand(8, 11); break;
    case 'tea':     a.target = CUP_X - 6; a.timer = rand(5, 7); break;
    case 'book':    a.target = SHELF_SPOT + rand(-3, 3); a.timer = rand(6, 9); break;
    case 'cat':     setLevel(a, 'floor'); a.timer = 14; break;
    case 'water':   setLevel(a, 'floor'); a.target = PLANT.x + 11; a.timer = 8; break; // waters the plant
    case 'highfive': {
      const b = findBuddy(a);
      if (!b) { a.action = 'look'; a.timer = 2; break; }
      a.buddy = b; b.buddy = a;
      if (b.seat) setSeat(b, false);
      b.action = 'buddy'; b.timer = 8; b.arrived = false;
      a.timer = 8;
      break;
    }
    case 'buddy':   a.timer = 8; break;
    case 'work':    a.timer = Infinity; break;
    case 'busy':    a.target = freeSpot(a, rand(66, 112)); a.timer = Infinity; break; // waits by the tank for a free computer
    case 'read':    a.target = freeSpot(a, SHELF_SPOT + rand(-3, 3)); a.timer = Infinity; break;
    case 'browse':  a.target = freeSpot(a, LAPTOP_SPOT); a.timer = Infinity; break;
    case 'summon':  a.target = freeSpot(a, PORTAL.x - 18); a.timer = Infinity; break; // calls its helper in through the portal
    case 'mail':    setLevel(a, 'floor'); a.target = freeSpot(a, MAIL_SPOT); a.timer = Infinity; break;
    case 'calendar': a.target = freeSpot(a, CALENDAR_SPOT); a.timer = Infinity; break;
    case 'ship':    a.target = PORTAL.x; a.timer = Infinity; break; // carries a pushed commit to the portal
    case 'chat': {
      const mate = agents.find(o => o !== a && o.level === a.level && o.info.project === a.info.project && FREE_ACTIONS.includes(o.action));
      if (!mate) { a.action = 'look'; a.timer = 2; break; }
      a.mate = mate; a.target = mate.x + (a.x < mate.x ? -11 : 11); a.timer = rand(5, 8);
      break;
    }
    case 'think':   a.target = rand(lo, hi); a.timer = rand(3, 6); break;
    case 'wait':    setLevel(a, 'floor'); a.waitSince = now; a.timer = Infinity; break; // off to the intercom
    case 'leave':   release(a); a.target = PORTAL.x; a.timer = Infinity; break;
    case 'alarm':   pop('!', a.x - 1, bottomOf(a) - 18, C.amber); if (grounded(a)) jump(a, -70); a.timer = 2; break;
    default:        a.timer = 2;
  }
}

// Agents waiting for the user, in the order they arrived; the first one is on the intercom
const callQueue = () => agents.filter(a => a.action === 'wait').sort((p, q) => p.waitSince - q.waitSince);
const onCall = a => a.action === 'wait' && a.arrived && callQueue()[0] === a;

function nextAction(a) {
  // free-time actions run out and pick another; the rest re-plan from the session state
  if (a.ship && a.action !== 'ship') startAction(a, 'ship');
  else if (a.activity === 'done' && !a.monitor) startAction(a, freeMood(a));
  else plan(a);
}

function updateAgent(a, dt, t) {
  a.moving = false;
  if (a.y !== 0 || a.vy !== 0) {
    a.vy += GRAVITY * dt;
    a.y += a.vy * dt;
    a.x += a.vx * dt;
    if (a.vy > 0 && a.y >= 0) { a.y = 0; a.vy = 0; a.vx = 0; a.squash = 0.12; }
  }
  a.squash = Math.max(0, a.squash - dt);
  a.happy = Math.max(0, a.happy - dt);
  a.timer -= dt;
  const ready = grounded(a) && a.squash === 0;
  const scale = fullScale(a);

  switch (a.action) {
    case 'spawn':
      if (world.portal.open < 1) break; // waits on the other side until the cat opens the portal
      if (a.scale === 0) { world.portalFlare = 0.8; pop(shortName(a.info.project || a.info.name, 8) || 'CLAUDE', PORTAL.x - 12, 86, C.green, 2); }
      a.scale = Math.min(scale, a.scale + dt * 1.6);
      if (a.scale >= scale && a.sub === 0) { a.sub = 1; jump(a, -60, -25); a.timer = 0.6; }
      break;
    case 'leave':
      if (a.level === 'floor') { setLevel(a, 'desk'); break; }
      if (walkTo(a, PORTAL.x, 18, dt) && world.portal.open >= 1) {
        a.arrived = true;
        a.scale -= dt * 1.8;
        world.portalFlare = 0.5;
        if (a.scale <= 0.05) a.gone = true;
      }
      break;
    case 'climb':
      if (grounded(a)) startAction(a, a.after);
      break;
    case 'work': {
      if (!a.task || !a.monitor) { release(a); a.timer = 0; break; }
      if (!walkTo(a, a.monitor.x + 27, 30, dt)) break;
      a.arrived = true;
      a.taskTime += dt;
      if (a.task === 'done' && a.taskTime > 4) { pop('*', a.x - 1, bottomOf(a) - 18, C.green); a.happy = 1.5; a.task = null; release(a); a.timer = 0; }
      break;
    }
    case 'busy':
      if (assignWork(a)) { startAction(a, 'work'); break; }
      a.arrived = walkTo(a, a.target, 16, dt) || a.arrived;
      break;
    case 'read': case 'browse': case 'gaze': case 'tea': case 'book':
      if (walkTo(a, a.target, 16, dt)) {
        if (!a.arrived && a.action === 'tea') { puffSteam(10, 8); a.happy = 1.5; }
        a.arrived = true;
      }
      break;
    case 'think':
      a.arrived = walkTo(a, a.target, 8, dt);
      break;
    case 'mail':
      if (a.level !== 'floor') break;
      a.arrived = walkTo(a, a.target, 22, dt);
      if (a.arrived && a.action === 'mail') world.mailFlag = 3;
      break;
    case 'calendar':
      a.arrived = walkTo(a, a.target, 18, dt);
      break;
    case 'ship':
      if (walkTo(a, PORTAL.x, 24, dt) && world.portal.open >= 1) {
        a.ship = false;
        world.portalFlare = 1;
        pop('SENT', PORTAL.x - 7, 88, C.green);
        a.happy = 1.5;
        a.timer = 0;
      }
      break;
    case 'chat': {
      const mate = a.mate;
      if (!mate || !agents.includes(mate) || mate.level !== a.level) { a.timer = 0; break; }
      a.arrived = walkTo(a, mate.x + (a.x < mate.x ? -11 : 11), 14, dt);
      if (a.arrived) a.face = Math.sign(mate.x - a.x) || 1;
      break;
    }
    case 'summon':
      if (walkTo(a, a.target, 22, dt)) {
        a.arrived = true;
        a.happy = Math.max(a.happy, 0.3); // waves its helper in
        if (Math.random() < dt * 0.8) world.portalFlare = 0.4;
      }
      break;
    case 'wait': {
      // the first in line takes the handset; the others queue beside the intercom
      if (a.level !== 'floor') break;
      a.arrived = walkTo(a, COMM.spot - callQueue().indexOf(a) * 16, 30, dt); // hurries: you are needed
      if (a.arrived && !onCall(a) && ready && Math.random() < dt * 0.3) jump(a, -40);
      break;
    }
    case 'fish':
      if (!walkTo(a, a.target, 14, dt)) break;
      a.arrived = true;
      if (Math.random() < dt * 0.4) { if (Math.random() < 0.5) feedFish(); else tapTank(a.x); a.happy = 1; }
      break;
    case 'water':
      if (a.level !== 'floor') break;
      if (walkTo(a, a.target, 16, dt)) { a.arrived = true; a.face = -1; }
      break;
    case 'cat': {
      if (a.level !== 'floor') break;
      if (!shown('cat') || cat.base !== FLOOR_Y || cat.action === 'portal') { a.timer = Math.min(a.timer, 1); break; } // the cat is busy
      const side = a.x < cat.x ? -1 : 1;
      if (!walkTo(a, cat.x + side * 13, 16, dt)) break;
      a.arrived = true;
      a.face = -side;
      petCat();
      break;
    }
    case 'highfive': {
      const b = a.buddy;
      if (!b) { a.timer = 0; break; }
      const meet = (a.x + b.x) / 2, side = a.x < b.x ? -1 : 1;
      const here = walkTo(a, meet + side * 9, 16, dt), there = walkTo(b, meet - side * 9, 16, dt);
      a.face = -side; b.face = side;
      if (here && there && !a.arrived) {
        a.arrived = b.arrived = true;
        jump(a, -60); jump(b, -60);
        pop('*', meet - 1, bottomOf(a) - 20, C.green);
        a.happy = b.happy = 2;
        a.timer = b.timer = 1.5;
      }
      break;
    }
    case 'hop':
      if (ready && a.hops > 0) { jump(a, -65, rand(-10, 10)); a.hops--; }
      break;
    case 'dance':
      if (ready) jump(a, -35, rand(-8, 8));
      if (Math.random() < dt * 1.5) pop('%', a.x + rand(-8, 6), bottomOf(a) - 16, C.blue);
      break;
    case 'sleep':
      if (Math.random() < dt * 0.5) pop('Z', a.x + 4, bottomOf(a) - 14, C.white, 2.2);
      break;
    case 'walk':
      if (walkTo(a, a.target, 14, dt)) a.timer = Math.min(a.timer, 0.6);
      break;
  }

  if (a.action === 'work' && a.arrived && a.task === 'fix' && (a.info.streak || 0) >= 3 && ready && Math.random() < dt * 0.4) {
    jump(a, -40); pop('!', a.x - 1, bottomOf(a) - 20, C.amber); // stomping on the bug
  }
  const [lo, hi] = a.level === 'floor' ? FLOOR_X : DESK_X;
  a.x = Math.max(lo, Math.min(hi, a.x));
  if (a.action === 'buddy' && !a.buddy) a.timer = 0;
  if (a.timer <= 0 && grounded(a)) nextAction(a);

  // Turn smoothly toward where the agent wants to face; dancing and taps make it spin
  if (a.action === 'dance') a.yaw += dt * 7;
  else if (a.spin > 0) { const step = Math.min(a.spin, dt * 12); a.yaw += step; a.spin -= step; }
  else a.yaw += angleDiff(yawTarget(a, t), a.yaw) * Math.min(1, dt * 8);
}

// 0 faces the camera, positive turns right, about 3 is the back
function yawTarget(a, t) {
  const walking = a.face * 1.1;
  if (a.moving) return walking;
  switch (a.action) {
    case 'work': case 'fish': case 'leave':
      return a.arrived ? Math.PI : walking;
    case 'read': case 'book': return a.arrived ? 2.4 : walking; // half turned to the shelf, face still showing
    case 'browse': return a.arrived ? -1.3 : walking; // turned toward the laptop
    case 'summon': return a.arrived ? 1.2 : walking;  // facing the portal
    case 'calendar': case 'ship': return a.arrived ? Math.PI : walking;
    case 'mail':  return a.arrived ? 1.3 : walking;
    case 'chat':  return a.arrived ? a.face * 1.2 : walking;
    case 'busy':  return 0.4;
    case 'tea':   return a.arrived ? 1.2 : walking;
    case 'gaze':  return a.arrived ? -2.6 : walking; // back to us, looking out of the window
    case 'cat':   return a.arrived ? a.face * 1.3 : walking;
    case 'water': return a.arrived ? -1.3 : walking;
    case 'highfive': case 'buddy': return a.face * 1.2;
    case 'think': return Math.sin(t * 0.8 + a.x) * 0.6;
    case 'look':  return Math.sin(t * 1.6 + a.x) * 1.2;
    case 'sleep': return 0.35;
    case 'wait':  return onCall(a) ? 1.3 : 0; // on call: turned to the intercom
    case 'alarm': case 'spawn': return 0;
    default:      return a.idleYaw;
  }
}

// ---------- Alerts: a soft chime and a desktop notification when someone needs you (opt-in) ----------

const alerts = { audio: null };

function chime() {
  try {
    const ac = alerts.audio = alerts.audio || new AudioContext(), t0 = ac.currentTime;
    [880, 660].forEach((freq, i) => {
      const o = ac.createOscillator(), g = ac.createGain(), at = t0 + i * 0.18;
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(0.08, at + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, at + 0.16);
      o.connect(g).connect(ac.destination);
      o.start(at); o.stop(at + 0.17);
    });
  } catch (e) { /* no audio */ }
}


function announce(a) {
  if (!cfg.alerts) return;
  chime();
  try {
    if ('Notification' in window && Notification.permission === 'granted')
      new Notification((a.info.name || 'Claude') + ' needs you', {
        body: (a.info.project ? a.info.project + ': ' : '') + (a.info.step || 'waiting for you'), tag: 'office-' + a.id });
  } catch (e) { /* notifications blocked */ }
}

// ---------- Live sessions from /state (or made-up ones with ?demo) ----------

function sync(list) {
  world.sessions = list.length;
  // busy sessions first, so idle ones are the ones left out when the room is full
  const order = { working: 0, error: 0, waiting: 1, thinking: 2, done: 3 };
  const shown = list.filter(c => cfg.helpers || !c.parent)
    .sort((p, q) => (order[p.state] ?? 4) - (order[q.state] ?? 4)).slice(0, Math.min(MAX_AGENTS, cfg.max));
  const ids = new Set(shown.map(c => c.id));
  for (const c of shown) applyState(agents.find(a => a.id === c.id) || spawnAgent(c), c);
  for (const a of agents) if (!ids.has(a.id) && a.action !== 'leave') { a.task = null; startAction(a, 'leave'); }
  renderList(list);
}

const DEMO = [
  { id: 'demo-a', name: 'Opus 5.5', project: 'Agent Room', colour: '#D97757' },
  { id: 'demo-b', name: 'Sonnet 5.5', project: 'Website', colour: '#6A9BCC' },
  { id: 'demo-c', name: 'Haiku 5.5', project: 'Scripts', colour: '#7FA36B' },
  { id: 'demo-d', name: 'Fable 5.1', project: 'Docs', colour: '#B08AD9' },
  { id: 'demo-a1', parent: 'demo-a', name: 'Explore', project: 'Agent Room', colour: '#D97757', desc: 'Find the API routes' }
];
const DEMO_TOOLS = ['Edit', 'Edit', 'Write', 'Bash', 'Bash', 'Read', 'Grep', 'WebSearch', 'TodoWrite', 'mcp__gmail__send', 'mcp__calendar__create_event'];
const DEMO_TODOS = ['Read the tracker', 'Add the window views', 'Hook up alerts', 'Write the tests', 'Update the docs'];
const DEMO_WORDS = { working: 'Working', thinking: 'Thinking', waiting: 'May need you', error: 'Fixing an error', done: 'Done', off: 'Idle' };

// Made-up sessions that change every 10 seconds, and sometimes come and go
function demoState() {
  const k = Math.floor(Date.now() / 10000);
  return DEMO.filter((s, i) => (k + i * 3) % 9 !== 0 && !(s.parent && k % 3 === 0)).map((s, i) => {
    const r = hash(k * 7 + i);
    const state = r < 0.5 ? 'working' : r < 0.6 ? 'thinking' : r < 0.68 ? 'waiting' : r < 0.72 ? 'error' : r < 0.92 ? 'done' : 'off';
    const tool = state === 'working' ? DEMO_TOOLS[Math.floor(hash(k * 3 + i) * DEMO_TOOLS.length)] : '';
    const now = Date.now() / 1000;
    return Object.assign({ parent: '', state, tool, word: DEMO_WORDS[state], step: tool ? tool + ': src/app.js' : '',
      turn: state === 'working' ? '1m 20s' : '', context: i === 1 ? '176k tokens' : '68k tokens', steps: 40 + i * 7, rate: 5 + i,
      todos: i === 0 ? DEMO_TODOS.map((text, n) => ({ text, status: n < k % 5 ? 'completed' : n === k % 5 ? 'in_progress' : 'pending' })) : [],
      todo_age: 5, edit: { file: 'app.js', added: 12 + (k % 7), removed: k % 4 },
      test: i === 0 ? (k % 2 ? 'pass' : 'fail') : '', test_age: now % 10,
      pushes: i === 0 ? Math.floor(now / 30) : 0, background: i === 2 ? 1 : 0, streak: state === 'error' ? 3 : 0 }, s);
  });
}

const demoToday = () => ({ done: 12, commit: 5, push: 2, pass: 9, fail: 1, top: '#D97757' });

async function poll() {
  if (params.has('demo')) { world.today = demoToday(); world.plant = { total: 420, today: 46, idle: 0 }; sync(demoState()); setTimeout(poll, 1500); return; }
  try {
    const d = await (await fetch('/state', { cache: 'no-store' })).json();
    world.ready = d.ready !== false;
    world.today = d.today || null;
    world.plant = d.plant || null;
    world.update = d.update || null;
    sync(d.claudes || []);
  } catch (e) {
    // server stopped: the desktop app window (opened with ?app) closes itself; elsewhere keep the last picture
    if (params.has('app')) window.close();
  }
  setTimeout(poll, 1500);
}

// ---------- Settings panel (tap the Pi): saved by the server in ~/.claude/office-settings.json ----------
// Without the server (a plain copy of the page) they stay in this browser instead.

const panel = document.getElementById('settings');
const $ = id => document.getElementById(id);
const STORE = 'office-settings';

async function loadSettings() {
  let d = null;
  try { d = await (await fetch('/settings', { cache: 'no-store' })).json(); } catch (e) { /* no server */ }
  if (!d) try { d = JSON.parse(localStorage.getItem(STORE) || 'null'); } catch (e) { /* storage blocked */ }
  Object.assign(cfg, d || {});
  fetchWeather();
  applyScreen();
}

let saveTimer = 0;
function saveSettings() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      const r = await fetch('/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cfg) });
      if (!r.ok) throw new Error(r.status);
      Object.assign(cfg, await r.json());
      $('sNote').textContent = 'Saved';
    } catch (e) {
      try { localStorage.setItem(STORE, JSON.stringify(cfg)); $('sNote').textContent = 'Saved in this browser'; }
      catch (e2) { $('sNote').textContent = 'Could not save'; }
    }
  }, 250);
}

function zoneList() {
  let zones = [];
  try { zones = Intl.supportedValuesOf('timeZone'); } catch (e) { /* older browser */ }
  if (!zones.length) zones = ['Asia/Bangkok', 'Asia/Tokyo', 'Asia/Singapore', 'Asia/Kolkata', 'Europe/London', 'Europe/Berlin',
    'America/New_York', 'America/Chicago', 'America/Los_Angeles', 'Australia/Sydney', 'UTC'];
  if (cfg.tz !== 'auto' && !zones.includes(cfg.tz)) zones = [cfg.tz, ...zones];
  const here = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';
  $('sTz').replaceChildren(new Option(`This computer (${here})`, 'auto'), ...zones.map(z => new Option(z.replace(/_/g, ' '), z)));
}

function fillPanel() {
  zoneList();
  $('sTz').value = cfg.tz;

  $('sClock24').checked = cfg.clock24;
  $('sWeather').checked = cfg.weather;
  $('sCity').value = cfg.city;

// A newer version is on GitHub: say so at the top of the settings, with the prompt to paste

  + '(follow the "Update from an older version" steps in its README).';

// Look a city up with Open-Meteo's free geocoding; only runs when FIND is pressed
async function findCity() {
  const name = $('sCity').value.trim();
  const out = $('sResults');
  if (name.length < 2) return;
  out.replaceChildren(el('div', 'note', 'Looking...'));
  try {
    const d = await (await fetch('https://geocoding-api.open-meteo.com/v1/search?count=5&language=en&format=json&name='
      + encodeURIComponent(name))).json();
    const found = d.results || [];
    out.replaceChildren(...(found.length ? found.map(c => {
      const b = el('button', '', [c.name, c.admin1, c.country].filter(Boolean).join(', '));
      b.onclick = () => {
        Object.assign(cfg, { city: c.name, lat: +c.latitude.toFixed(4), lon: +c.longitude.toFixed(4) });
        if (c.timezone) cfg.tz = c.timezone;
        cfg.label = c.name.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 3) || cfg.label;
        fillPanel();
        fetchWeather();
        saveSettings();
      };
      return b;
    }) : [el('div', 'note', 'No city found')]));
  } catch (e) { out.replaceChildren(el('div', 'note', 'Could not reach the city search')); }
}

function bindSettings() {
  const on = (id, ev, f) => $(id).addEventListener(ev, () => { f($(id)); saveSettings(); });
  on('sTz', 'change', e => { cfg.tz = e.value; fetchWeather(); });
  on('sLabel', 'input', e => { cfg.label = e.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4); });
  on('sClock24', 'change', e => { cfg.clock24 = e.checked; });
  on('sWeather', 'change', e => { cfg.weather = e.checked; fetchWeather(); });
  on('sUnits', 'change', e => { cfg.units = e.value; });
  on('sAlerts', 'change', e => {
    cfg.alerts = e.checked;
    if (cfg.alerts) {
      chime();
      if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
    }
  });
  on('sIdle', 'change', e => { cfg.idle = +e.value; });
  on('sMax', 'change', e => { cfg.max = +e.value; });
  on('sHelpers', 'change', e => { cfg.helpers = e.checked; });
  on('sCalm', 'change', e => { cfg.calm = e.checked; });
  on('sView', 'change', e => { cfg.view = e.value; });
  on('sCat', 'change', e => { cfg.cat = e.value; });
  on('sSound', 'change', e => { cfg.sound = e.checked; soundOn(); });
  on('sUpdates', 'change', e => { cfg.updates = e.checked; });
  on('sBright', 'input', e => { cfg.brightness = +e.value; applyScreen(); });
  on('sShift', 'change', e => { cfg.shift = e.checked; applyScreen(); });

  $('sFull').addEventListener('click', toggleFull);
  for (const [k, name] of SHOW) {
    const box = el('input');
    box.type = 'checkbox'; box.id = 'sShow_' + k;
    const label = el('label', 'check');
    label.append(box, document.createTextNode(' ' + name));
